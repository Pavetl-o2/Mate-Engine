<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Avatar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="avatar-container">
    <canvas id="avatar-canvas"></canvas>
  </div>

  <script>
    // ==========================================
    // Desktop Avatar - Renderer
    // ==========================================

    const { ipcRenderer } = require('electron');
    const path = require('path');
    const fs = require('fs');
    const THREE = require('three');

    // Variables globales
    let scene, camera, renderer, model, mixer, clock;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    // Iniciar cuando la página cargue
    window.onload = init;

    async function init() {
      console.log('=== Desktop Avatar ===');
      console.log('Three.js version:', THREE.REVISION);

      // Ruta al modelo
      const modelPath = path.join(__dirname, '../../assets/models/avatar.glb');
      console.log('Modelo:', modelPath);

      // Verificar archivo
      if (!fs.existsSync(modelPath)) {
        showError('No se encontró: avatar.glb');
        return;
      }

      console.log('Archivo encontrado!');

      // Setup
      setupScene();
      setupLights();
      setupControls();

      // Cargar modelo
      await loadGLB(modelPath);

      // Iniciar loop
      animate();
    }

    function setupScene() {
      const canvas = document.getElementById('avatar-canvas');

      // Escena
      scene = new THREE.Scene();

      // Cámara
      const aspect = canvas.clientWidth / canvas.clientHeight;
      camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 100);
      camera.position.set(0, 1, 3);
      camera.lookAt(0, 0.8, 0);

      // Renderer
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      // Clock
      clock = new THREE.Clock();

      console.log('Escena lista');
    }

    function setupLights() {
      // Luz ambiental
      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      // Luz direccional frontal
      const front = new THREE.DirectionalLight(0xffffff, 1);
      front.position.set(0, 2, 3);
      scene.add(front);

      // Luz de relleno
      const fill = new THREE.DirectionalLight(0xffffff, 0.5);
      fill.position.set(-2, 1, 0);
      scene.add(fill);

      // Luz trasera
      const back = new THREE.DirectionalLight(0xffffff, 0.3);
      back.position.set(0, 1, -2);
      scene.add(back);

      console.log('Luces listas');
    }

    async function loadGLB(filePath) {
      console.log('Cargando GLB...');

      // Leer archivo como buffer
      const buffer = fs.readFileSync(filePath);
      const arrayBuffer = buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);

      // Usar GLTFLoader
      const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
      const loader = new GLTFLoader();

      return new Promise((resolve, reject) => {
        loader.parse(
          arrayBuffer,
          '',
          (gltf) => {
            console.log('GLB parseado:', gltf);

            model = gltf.scene;
            scene.add(model);

            // Ajustar modelo
            fitModel(model);

            // Animaciones
            if (gltf.animations.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              const action = mixer.clipAction(gltf.animations[0]);
              action.play();
              console.log('Animación:', gltf.animations[0].name);
            }

            console.log('Modelo cargado!');
            resolve(gltf);
          },
          (error) => {
            console.error('Error parseando GLB:', error);
            showError('Error cargando modelo');
            reject(error);
          }
        );
      });
    }

    function fitModel(obj) {
      // Calcular bounds
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      console.log('Tamaño original:', size);

      // Escalar para que quepa
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.6 / maxDim;
      obj.scale.setScalar(scale);

      // Recalcular
      box.setFromObject(obj);
      box.getCenter(center);

      // Centrar y poner en el suelo
      obj.position.x = -center.x;
      obj.position.y = -box.min.y + 0.05;
      obj.position.z = -center.z;

      // Ajustar cámara
      const h = size.y * scale;
      camera.position.set(0, h * 0.5, 2.8);
      camera.lookAt(0, h * 0.45, 0);

      console.log('Modelo ajustado, escala:', scale);
    }

    function setupControls() {
      const container = document.getElementById('avatar-container');

      container.onmousedown = async (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        const pos = await ipcRenderer.invoke('get-avatar-position');
        dragOffset.x = e.screenX - pos.x;
        dragOffset.y = e.screenY - pos.y;
      };

      document.onmousemove = async (e) => {
        if (!isDragging) return;
        await ipcRenderer.invoke('set-avatar-position', {
          x: e.screenX - dragOffset.x,
          y: e.screenY - dragOffset.y
        });
      };

      document.onmouseup = () => {
        isDragging = false;
      };
    }

    function animate() {
      requestAnimationFrame(animate);

      if (mixer) {
        mixer.update(clock.getDelta());
      }

      renderer.render(scene, camera);
    }

    function showError(msg) {
      document.getElementById('avatar-container').innerHTML = `
        <div style="
          color: #fff;
          background: linear-gradient(135deg, #c0392b, #e74c3c);
          padding: 15px;
          font-family: Arial, sans-serif;
          font-size: 12px;
          border-radius: 8px;
          text-align: center;
          box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        ">
          <strong>Error</strong><br><br>
          ${msg}<br><br>
          <small>Revisa la consola (DevTools)</small>
        </div>
      `;
    }
  </script>
</body>
</html>
