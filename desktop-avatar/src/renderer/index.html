<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:">
  <title>Desktop Avatar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="avatar-container">
    <canvas id="avatar-canvas"></canvas>
  </div>

  <div id="debug-overlay" style="display: none;">
    <div id="debug-info"></div>
  </div>

  <script>
    // Load Three.js from node_modules
    const THREE = require('three');
    const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
    const { OrbitControls } = require('three/examples/jsm/controls/OrbitControls.js');
    const path = require('path');

    // Make available globally
    window.THREE = THREE;
    window.GLTFLoader = GLTFLoader;
    window.OrbitControls = OrbitControls;
    window.nodePath = path;
  </script>
  <script src="renderer-simple.js"></script>
</body>
</html>
