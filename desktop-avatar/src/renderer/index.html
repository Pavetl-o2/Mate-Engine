<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Avatar</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Preparar rutas para import map
    const basePath = 'file:///' + __dirname.replace(/\\/g, '/');
    const nodeModules = basePath + '/../../node_modules';

    // Crear import map dinámicamente
    const importMap = {
      imports: {
        "three": nodeModules + "/three/build/three.module.js",
        "three/": nodeModules + "/three/"
      }
    };

    const script = document.createElement('script');
    script.type = 'importmap';
    script.textContent = JSON.stringify(importMap);
    document.head.appendChild(script);
  </script>
</head>
<body>
  <div id="avatar-container">
    <canvas id="avatar-canvas"></canvas>
  </div>

  <script>
    // Guardar referencias de Node.js antes de cargar módulos ES
    window.nodeRequire = require;
    window.nodeFs = require('fs');
    window.nodePath = require('path');
    window.nodeIpc = require('electron').ipcRenderer;
    window.appDirname = __dirname;
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    // Variables globales
    let scene, camera, renderer, model, mixer, clock;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    // Acceso a Node.js
    const fs = window.nodeFs;
    const path = window.nodePath;
    const ipcRenderer = window.nodeIpc;
    const __dirname = window.appDirname;

    console.log('=== Desktop Avatar ===');
    console.log('Three.js version:', THREE.REVISION);

    // Ruta al modelo
    const modelPath = path.join(__dirname, '../../assets/models/avatar.glb');
    console.log('Modelo:', modelPath);

    // Verificar archivo
    if (!fs.existsSync(modelPath)) {
      showError('No se encontró: avatar.glb');
    } else {
      console.log('Archivo encontrado!');
      init();
    }

    async function init() {
      setupScene();
      setupLights();
      setupControls();
      await loadGLB(modelPath);
      animate();
    }

    function setupScene() {
      const canvas = document.getElementById('avatar-canvas');

      scene = new THREE.Scene();

      const aspect = canvas.clientWidth / canvas.clientHeight;
      camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 100);
      camera.position.set(0, 1, 3);
      camera.lookAt(0, 0.8, 0);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      clock = new THREE.Clock();
      console.log('Escena lista');
    }

    function setupLights() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));

      const front = new THREE.DirectionalLight(0xffffff, 1);
      front.position.set(0, 2, 3);
      scene.add(front);

      const fill = new THREE.DirectionalLight(0xffffff, 0.5);
      fill.position.set(-2, 1, 0);
      scene.add(fill);

      const back = new THREE.DirectionalLight(0xffffff, 0.3);
      back.position.set(0, 1, -2);
      scene.add(back);

      console.log('Luces listas');
    }

    async function loadGLB(filePath) {
      console.log('Cargando GLB...');

      // Leer archivo
      const buffer = fs.readFileSync(filePath);
      const arrayBuffer = buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);

      const loader = new GLTFLoader();

      return new Promise((resolve, reject) => {
        loader.parse(
          arrayBuffer,
          '',
          (gltf) => {
            console.log('GLB parseado:', gltf);

            model = gltf.scene;
            scene.add(model);
            fitModel(model);

            if (gltf.animations.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              mixer.clipAction(gltf.animations[0]).play();
              console.log('Animación:', gltf.animations[0].name);
            }

            console.log('¡Modelo cargado!');
            resolve(gltf);
          },
          (error) => {
            console.error('Error:', error);
            showError('Error cargando modelo');
            reject(error);
          }
        );
      });
    }

    function fitModel(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      console.log('Tamaño:', size);

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.6 / maxDim;
      obj.scale.setScalar(scale);

      box.setFromObject(obj);
      box.getCenter(center);

      obj.position.x = -center.x;
      obj.position.y = -box.min.y + 0.05;
      obj.position.z = -center.z;

      const h = size.y * scale;
      camera.position.set(0, h * 0.5, 2.8);
      camera.lookAt(0, h * 0.45, 0);

      console.log('Escala:', scale);
    }

    function setupControls() {
      const container = document.getElementById('avatar-container');

      container.onmousedown = async (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        const pos = await ipcRenderer.invoke('get-avatar-position');
        dragOffset.x = e.screenX - pos.x;
        dragOffset.y = e.screenY - pos.y;
      };

      document.onmousemove = async (e) => {
        if (!isDragging) return;
        await ipcRenderer.invoke('set-avatar-position', {
          x: e.screenX - dragOffset.x,
          y: e.screenY - dragOffset.y
        });
      };

      document.onmouseup = () => isDragging = false;
    }

    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(clock.getDelta());
      renderer.render(scene, camera);
    }

    function showError(msg) {
      document.getElementById('avatar-container').innerHTML = `
        <div style="color:#fff; background:linear-gradient(135deg,#c0392b,#e74c3c);
          padding:15px; font-family:Arial; font-size:12px; border-radius:8px; text-align:center;">
          <strong>Error</strong><br><br>${msg}
        </div>
      `;
    }
  </script>
</body>
</html>
