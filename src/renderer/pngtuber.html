<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Avatar - PNGTuber</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* PNGTuber specific styles */
    #pngtuber-container {
      width: 50%;
      height: 100%;
      position: absolute;
      right: 0;
      top: 0;
      background: transparent;
      cursor: grab;
      -webkit-app-region: drag;
    }

    #avatar-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
    }

    #mouth-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #debug-info {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 5px;
      font-family: monospace;
      font-size: 10px;
      border-radius: 3px;
      display: none;
    }

    #debug-info.visible {
      display: block;
    }

    /* Calibration mode */
    #calibrate-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      cursor: pointer;
      z-index: 1000;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity 0.3s, transform 0.2s;
    }

    #calibrate-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    #calibrate-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    #calibration-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      -webkit-app-region: no-drag;
    }

    #calibration-overlay.visible {
      display: flex;
    }

    #calibration-instructions {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 10px 20px;
      border-radius: 0 0 10px 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-align: center;
      max-width: 90%;
    }

    #calibration-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    #mouth-marker {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 3px dashed #00ff00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    #mouth-marker::before {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff00;
      font-size: 24px;
      font-weight: bold;
    }

    #calibration-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1001;
    }

    #calibration-controls button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #calibration-controls button:hover {
      transform: scale(1.05);
    }

    #save-calibration {
      background: linear-gradient(135deg, #00c853, #00e676);
      color: white;
    }

    #cancel-calibration {
      background: linear-gradient(135deg, #ff5252, #ff1744);
      color: white;
    }

    #scale-control {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px 15px;
      border-radius: 20px;
      z-index: 1001;
    }

    #scale-control label {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    #scale-slider {
      width: 120px;
      cursor: pointer;
    }

    /* Frame navigation controls */
    #frame-control {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.85);
      padding: 12px 15px;
      border-radius: 20px;
      z-index: 1001;
    }

    #frame-control button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #555;
      color: white;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #frame-control button:hover {
      background: #777;
    }

    #frame-control button.active {
      background: #00c853;
    }

    #frame-slider {
      width: 150px;
      cursor: pointer;
    }

    #frame-info {
      color: white;
      font-family: monospace;
      font-size: 11px;
      min-width: 80px;
      text-align: center;
    }

    #add-keyframe {
      background: linear-gradient(135deg, #ff9800, #f57c00) !important;
      width: auto !important;
      padding: 0 12px !important;
      border-radius: 16px !important;
      font-size: 11px !important;
    }

    #keyframe-count {
      color: #ff9800;
      font-family: Arial, sans-serif;
      font-size: 10px;
    }

    /* Keyframe markers on slider */
    #keyframe-markers {
      position: absolute;
      bottom: 155px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 8px;
      margin-left: 60px;
      pointer-events: none;
    }

    .keyframe-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ff9800;
      border-radius: 50%;
      transform: translateX(-50%);
      top: 0;
    }
  </style>
</head>
<body>
  <div id="pngtuber-container">
    <video id="avatar-video" loop muted playsinline></video>
    <canvas id="mouth-canvas"></canvas>
    <div id="debug-info"></div>
  </div>

  <!-- Calibrate Button -->
  <button id="calibrate-btn" title="Calibrar posición de boca">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
  </button>

  <!-- Calibration Overlay -->
  <div id="calibration-overlay">
    <div id="calibration-instructions">
      <strong>Modo Calibración con Keyframes</strong><br>
      1. Navega por los frames del video<br>
      2. Posiciona la boca y presiona "+ Keyframe" para marcar<br>
      3. Repite en varios puntos del loop para tracking dinámico
    </div>
    <div id="calibration-area"></div>
    <div id="mouth-marker"></div>
    <div id="keyframe-markers"></div>
    <div id="frame-control">
      <button id="frame-prev-10" title="Retroceder 10 frames">⏪</button>
      <button id="frame-prev" title="Frame anterior">◀</button>
      <button id="frame-play" title="Play/Pause">⏸</button>
      <button id="frame-next" title="Frame siguiente">▶</button>
      <button id="frame-next-10" title="Avanzar 10 frames">⏩</button>
      <input type="range" id="frame-slider" min="0" max="100" value="0">
      <span id="frame-info">0 / 0</span>
      <button id="add-keyframe" title="Agregar keyframe en este frame">+ Keyframe</button>
      <span id="keyframe-count">0 keys</span>
    </div>
    <div id="scale-control">
      <label>Tamaño:</label>
      <input type="range" id="scale-slider" min="5" max="40" value="15">
      <span id="scale-value">15%</span>
    </div>
    <div id="calibration-controls">
      <button id="save-calibration">✓ Guardar</button>
      <button id="cancel-calibration">✗ Cancelar</button>
    </div>
  </div>

  <!-- Chat Toggle Button -->
  <button id="chat-toggle" title="Chat">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
  </button>

  <!-- Chat Box -->
  <div id="chat-container">
    <div id="chat-box">
      <div id="chat-messages"></div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="chat-send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Audio element for TTS playback -->
  <audio id="tts-audio" style="display:none;" crossorigin="anonymous"></audio>

  <script>
    const fs = require('fs');
    const path = require('path');
    const zlib = require('zlib');
    const { ipcRenderer } = require('electron');

    // ============================================
    // NPZ/NPY PARSER (for MotionPNGTuber compatibility)
    // ============================================

    class NPZParser {
      /**
       * Parse NPY format buffer (NumPy binary format)
       * Format: magic string + version + header_len + header (dict) + data
       */
      static parseNPY(buffer) {
        const view = new DataView(buffer.buffer || buffer);

        // Check magic number: \x93NUMPY
        const magic = String.fromCharCode(buffer[0], buffer[1], buffer[2], buffer[3], buffer[4], buffer[5]);
        if (magic !== '\x93NUMPY') {
          throw new Error('Invalid NPY file: wrong magic number');
        }

        // Version
        const majorVersion = buffer[6];
        const minorVersion = buffer[7];

        // Header length (depends on version)
        let headerLen, headerOffset;
        if (majorVersion === 1) {
          headerLen = view.getUint16(8, true); // little-endian
          headerOffset = 10;
        } else {
          headerLen = view.getUint32(8, true); // little-endian
          headerOffset = 12;
        }

        // Parse header (Python dict-like string)
        const headerStr = new TextDecoder().decode(buffer.slice(headerOffset, headerOffset + headerLen));
        const header = this.parseNPYHeader(headerStr);

        // Data starts after header
        const dataOffset = headerOffset + headerLen;
        const dataBuffer = buffer.slice(dataOffset);

        // Parse data based on dtype
        return this.parseNPYData(dataBuffer, header);
      }

      static parseNPYHeader(headerStr) {
        // Parse Python dict-like header: {'descr': '<f4', 'fortran_order': False, 'shape': (100, 4, 2)}
        const descrMatch = headerStr.match(/'descr':\s*'([^']+)'/);
        const shapeMatch = headerStr.match(/'shape':\s*\(([^)]+)\)/);
        const fortranMatch = headerStr.match(/'fortran_order':\s*(True|False)/);

        const dtype = descrMatch ? descrMatch[1] : '<f8';
        const shapeStr = shapeMatch ? shapeMatch[1] : '';
        const shape = shapeStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        const fortranOrder = fortranMatch ? fortranMatch[1] === 'True' : false;

        return { dtype, shape, fortranOrder };
      }

      static parseNPYData(buffer, header) {
        const { dtype, shape } = header;
        const totalElements = shape.reduce((a, b) => a * b, 1);

        let data;
        const view = new DataView(buffer.buffer || buffer);

        // Parse based on dtype
        if (dtype.includes('f4') || dtype.includes('float32')) {
          // float32
          data = new Float32Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getFloat32(i * 4, dtype[0] === '<');
          }
        } else if (dtype.includes('f8') || dtype.includes('float64')) {
          // float64
          data = new Float64Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getFloat64(i * 8, dtype[0] === '<');
          }
        } else if (dtype.includes('i4') || dtype.includes('int32')) {
          // int32
          data = new Int32Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getInt32(i * 4, dtype[0] === '<');
          }
        } else if (dtype.includes('b1') || dtype.includes('bool')) {
          // boolean
          data = new Uint8Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = buffer[i];
          }
        } else if (dtype.includes('u1') || dtype.includes('uint8')) {
          // uint8
          data = new Uint8Array(buffer.slice(0, totalElements));
        } else {
          // Default to float64
          data = new Float64Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getFloat64(i * 8, true);
          }
        }

        return { data, shape, dtype };
      }

      /**
       * Load NPZ file (ZIP archive of NPY files)
       */
      static loadNPZ(filePath) {
        const fileBuffer = fs.readFileSync(filePath);
        const entries = {};

        // NPZ is a ZIP file - parse it manually
        let offset = 0;
        while (offset < fileBuffer.length - 4) {
          // Look for local file header signature: PK\x03\x04
          if (fileBuffer[offset] !== 0x50 || fileBuffer[offset + 1] !== 0x4B ||
              fileBuffer[offset + 2] !== 0x03 || fileBuffer[offset + 3] !== 0x04) {
            break;
          }

          const view = new DataView(fileBuffer.buffer, offset);

          // Parse local file header
          const compressionMethod = view.getUint16(8, true);
          const compressedSize = view.getUint32(18, true);
          const uncompressedSize = view.getUint32(22, true);
          const fileNameLen = view.getUint16(26, true);
          const extraFieldLen = view.getUint16(28, true);

          const headerSize = 30;
          const fileName = fileBuffer.slice(offset + headerSize, offset + headerSize + fileNameLen).toString('utf8');
          const dataStart = offset + headerSize + fileNameLen + extraFieldLen;
          const compressedData = fileBuffer.slice(dataStart, dataStart + compressedSize);

          // Decompress if needed
          let data;
          if (compressionMethod === 0) {
            // No compression
            data = compressedData;
          } else if (compressionMethod === 8) {
            // Deflate
            data = zlib.inflateRawSync(compressedData);
          } else {
            console.warn(`Unknown compression method ${compressionMethod} for ${fileName}`);
            offset = dataStart + compressedSize;
            continue;
          }

          // Parse NPY data if it's a .npy file
          const baseName = fileName.replace('.npy', '');
          if (fileName.endsWith('.npy')) {
            try {
              entries[baseName] = this.parseNPY(data);
            } catch (e) {
              console.warn(`Error parsing ${fileName}:`, e);
            }
          }

          offset = dataStart + compressedSize;
        }

        return entries;
      }
    }

    // ============================================
    // MOUTH TRACK DATA (per-frame tracking)
    // ============================================

    class MouthTrack {
      constructor() {
        this.quads = null;      // Array of quad coordinates per frame (N x 4 x 2)
        this.valid = null;      // Boolean array indicating valid frames
        this.totalFrames = 0;
        this.srcWidth = 0;
        this.srcHeight = 0;
        this.fps = 30;
        this.hasData = false;

        // Fallback static position (used when no NPZ tracking)
        this.staticPosition = { x: 0.5, y: 0.7 };
        this.staticScale = 0.15;
      }

      /**
       * Load tracking data from NPZ file (MotionPNGTuber format)
       */
      loadFromNPZ(filePath, targetWidth, targetHeight) {
        try {
          const npzData = NPZParser.loadNPZ(filePath);

          // Get quad data
          if (npzData.quad) {
            const { data, shape } = npzData.quad;
            this.totalFrames = shape[0];

            // Reshape flat array to [N][4][2] structure
            this.quads = [];
            for (let i = 0; i < this.totalFrames; i++) {
              const quad = [];
              for (let j = 0; j < 4; j++) {
                const idx = (i * 4 + j) * 2;
                quad.push([data[idx], data[idx + 1]]);
              }
              this.quads.push(quad);
            }
          } else if (npzData.bbox) {
            // Alternative: bbox format (x, y, w, h) - convert to quad
            const { data, shape } = npzData.bbox;
            this.totalFrames = shape[0];
            this.quads = [];

            for (let i = 0; i < this.totalFrames; i++) {
              const idx = i * 4;
              const x = data[idx];
              const y = data[idx + 1];
              const w = data[idx + 2];
              const h = data[idx + 3];

              // Convert bbox to quad (4 corners)
              this.quads.push([
                [x, y],           // top-left
                [x + w, y],       // top-right
                [x + w, y + h],   // bottom-right
                [x, y + h]        // bottom-left
              ]);
            }
          }

          // Get valid flags
          if (npzData.valid) {
            this.valid = Array.from(npzData.valid.data);
          } else {
            this.valid = new Array(this.totalFrames).fill(1);
          }

          // Get source dimensions
          this.srcWidth = npzData.w?.data?.[0] || targetWidth;
          this.srcHeight = npzData.h?.data?.[0] || targetHeight;

          // Get FPS if available
          if (npzData.fps) {
            this.fps = npzData.fps.data[0];
          }

          // Scale quads to target dimensions
          if (this.quads && (this.srcWidth !== targetWidth || this.srcHeight !== targetHeight)) {
            const scaleX = targetWidth / this.srcWidth;
            const scaleY = targetHeight / this.srcHeight;

            for (let i = 0; i < this.quads.length; i++) {
              for (let j = 0; j < 4; j++) {
                this.quads[i][j][0] *= scaleX;
                this.quads[i][j][1] *= scaleY;
              }
            }
          }

          // Fill invalid frames by holding previous valid
          this.fillInvalidFrames();

          this.hasData = this.quads && this.quads.length > 0;
          console.log(`Loaded NPZ tracking: ${this.totalFrames} frames, hasData: ${this.hasData}`);
          return true;
        } catch (e) {
          console.error('Error loading NPZ:', e);
          return false;
        }
      }

      /**
       * Load tracking from JSON file (simpler format for manual configuration)
       * JSON format: { frames: [[{x,y}, {x,y}, {x,y}, {x,y}], ...], fps: 30 }
       * Or simpler: { mouth: {x, y, scale}, fps: 30 } for static position
       */
      loadFromJSON(filePath, targetWidth, targetHeight) {
        try {
          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));

          // Check if it has per-frame data
          if (data.frames && Array.isArray(data.frames)) {
            this.totalFrames = data.frames.length;
            this.quads = data.frames.map(frame => {
              if (Array.isArray(frame) && frame.length === 4) {
                return frame.map(p => [p.x || p[0], p.y || p[1]]);
              }
              return null;
            });
            this.valid = this.quads.map(q => q !== null);
            this.fps = data.fps || 30;
            this.hasData = true;
            this.fillInvalidFrames();
            return true;
          }

          // Static position fallback
          if (data.mouth) {
            this.staticPosition = { x: data.mouth.x, y: data.mouth.y };
            this.staticScale = data.mouth.scale || 0.15;
          }

          return false;
        } catch (e) {
          console.log('Error loading JSON tracking:', e);
          return false;
        }
      }

      /**
       * Fill invalid frames by holding the last valid frame
       */
      fillInvalidFrames() {
        if (!this.quads || !this.valid) return;

        let lastValid = null;

        // Forward pass - fill with previous valid
        for (let i = 0; i < this.totalFrames; i++) {
          if (this.valid[i]) {
            lastValid = this.quads[i];
          } else if (lastValid) {
            this.quads[i] = JSON.parse(JSON.stringify(lastValid));
          }
        }

        // Backward pass - fill frames before first valid
        lastValid = null;
        for (let i = this.totalFrames - 1; i >= 0; i--) {
          if (this.valid[i]) {
            lastValid = this.quads[i];
          } else if (lastValid && !this.quads[i]) {
            this.quads[i] = JSON.parse(JSON.stringify(lastValid));
          }
        }
      }

      /**
       * Get quad coordinates for a specific frame index
       */
      getQuad(frameIndex) {
        if (!this.hasData || !this.quads) return null;

        const idx = Math.floor(frameIndex) % this.totalFrames;
        return this.quads[idx];
      }

      /**
       * Get center position and scale from quad (for simplified rendering)
       */
      getPositionFromQuad(quad, canvasWidth, canvasHeight) {
        if (!quad) {
          return {
            x: this.staticPosition.x,
            y: this.staticPosition.y,
            scale: this.staticScale,
            rotation: 0
          };
        }

        // Calculate center from quad corners
        const centerX = (quad[0][0] + quad[1][0] + quad[2][0] + quad[3][0]) / 4;
        const centerY = (quad[0][1] + quad[1][1] + quad[2][1] + quad[3][1]) / 4;

        // Calculate width from quad (distance between left and right edges)
        const width = Math.sqrt(
          Math.pow(quad[1][0] - quad[0][0], 2) + Math.pow(quad[1][1] - quad[0][1], 2)
        );

        // Calculate rotation angle
        const angle = Math.atan2(quad[1][1] - quad[0][1], quad[1][0] - quad[0][0]);

        return {
          x: centerX / canvasWidth,
          y: centerY / canvasHeight,
          scale: width / canvasWidth,
          rotation: angle
        };
      }
    }

    // ============================================
    // PNGTUBER ENGINE
    // ============================================

    class PNGTuberEngine {
      constructor() {
        this.video = document.getElementById('avatar-video');
        this.canvas = document.getElementById('mouth-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.debugInfo = document.getElementById('debug-info');

        // Mouth sprites
        this.mouthSprites = {};
        this.currentMouth = 'closed';

        // Audio analysis
        this.audioContext = null;
        this.analyser = null;
        this.dataArray = null;

        // Lip-sync state
        this.isAnalyzing = false;
        this.mouthPosition = { x: 0.5, y: 0.7 }; // Relative position (fallback)
        this.mouthScale = 0.15; // Relative to video width (fallback)
        this.mouthRotation = 0;

        // Frame tracking
        this.mouthTrack = new MouthTrack();
        this.videoFPS = 30;
        this.usePerFrameTracking = false;

        // Paths
        this.basePath = path.join(__dirname, '../../assets/pngtuber');
      }

      async init() {
        console.log('PNGTuber Engine initializing...');

        // Check if assets exist
        const videoPath = path.join(this.basePath, 'video.mp4');
        if (!fs.existsSync(videoPath)) {
          this.showPlaceholder('Falta video.mp4 en assets/pngtuber/');
          return false;
        }

        // Load video
        this.video.src = 'file://' + videoPath.replace(/\\/g, '/');
        await this.video.play().catch(e => console.log('Video autoplay blocked:', e));

        // Get video metadata
        await new Promise(resolve => {
          if (this.video.readyState >= 1) resolve();
          else this.video.addEventListener('loadedmetadata', resolve, { once: true });
        });

        this.videoFPS = 30; // Default FPS, can be overridden by tracking data
        const videoWidth = this.video.videoWidth;
        const videoHeight = this.video.videoHeight;
        console.log(`Video dimensions: ${videoWidth}x${videoHeight}`);

        // Load mouth sprites
        await this.loadMouthSprites();

        // Setup canvas
        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());

        // Load per-frame tracking data (NPZ from MotionPNGTuber or JSON)
        await this.loadTrackingData(videoWidth, videoHeight);

        // Start render loop
        this.render();

        console.log('PNGTuber Engine ready!');
        return true;
      }

      async loadTrackingData(videoWidth, videoHeight) {
        // Try to load NPZ first (MotionPNGTuber format)
        const npzPath = path.join(this.basePath, 'mouth_track.npz');
        const npzCalibratedPath = path.join(this.basePath, 'mouth_track_calibrated.npz');

        // Prefer calibrated version
        if (fs.existsSync(npzCalibratedPath)) {
          console.log('Loading calibrated NPZ tracking data...');
          this.usePerFrameTracking = this.mouthTrack.loadFromNPZ(npzCalibratedPath, videoWidth, videoHeight);
        } else if (fs.existsSync(npzPath)) {
          console.log('Loading NPZ tracking data...');
          this.usePerFrameTracking = this.mouthTrack.loadFromNPZ(npzPath, videoWidth, videoHeight);
        }

        // Fallback to JSON if NPZ not found or failed
        if (!this.usePerFrameTracking) {
          const jsonPath = path.join(this.basePath, 'tracking.json');
          if (fs.existsSync(jsonPath)) {
            console.log('Loading JSON tracking data...');
            this.usePerFrameTracking = this.mouthTrack.loadFromJSON(jsonPath, videoWidth, videoHeight);

            // If JSON has static position only, use it as fallback
            if (!this.usePerFrameTracking) {
              this.mouthPosition = { ...this.mouthTrack.staticPosition };
              this.mouthScale = this.mouthTrack.staticScale;
              console.log('Using static position from tracking.json');
            }
          }
        }

        if (this.usePerFrameTracking) {
          console.log(`Per-frame tracking enabled: ${this.mouthTrack.totalFrames} frames`);
          this.videoFPS = this.mouthTrack.fps;
        } else {
          console.log('Using static mouth position (no per-frame tracking)');
        }
      }

      /**
       * Get current video frame index
       */
      getCurrentFrameIndex() {
        if (!this.video || this.video.paused) return 0;

        const currentTime = this.video.currentTime;
        const frameIndex = Math.floor(currentTime * this.videoFPS);

        return frameIndex;
      }

      async loadMouthSprites() {
        const mouthTypes = ['closed', 'half', 'open', 'e', 'u'];
        const mouthsPath = path.join(this.basePath, 'mouths');

        for (const type of mouthTypes) {
          const spritePath = path.join(mouthsPath, `${type}.png`);
          if (fs.existsSync(spritePath)) {
            const img = new Image();
            img.src = 'file://' + spritePath.replace(/\\/g, '/');
            await new Promise(resolve => img.onload = resolve);
            this.mouthSprites[type] = img;
            console.log(`Loaded mouth sprite: ${type}`);
          }
        }

        // If no sprites found, create simple colored circles as fallback
        if (Object.keys(this.mouthSprites).length === 0) {
          console.log('No mouth sprites found, using fallback');
          this.createFallbackSprites();
        }
      }

      createFallbackSprites() {
        const sizes = {
          closed: 5,
          half: 10,
          open: 20,
          e: 15,
          u: 12
        };

        for (const [type, size] of Object.entries(sizes)) {
          const canvas = document.createElement('canvas');
          canvas.width = 50;
          canvas.height = 50;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath();
          ctx.ellipse(25, 25, 20, size, 0, 0, Math.PI * 2);
          ctx.fill();

          const img = new Image();
          img.src = canvas.toDataURL();
          this.mouthSprites[type] = img;
        }
      }

      resizeCanvas() {
        this.canvas.width = this.canvas.offsetWidth;
        this.canvas.height = this.canvas.offsetHeight;
      }

      connectAudio(audioElement) {
        if (!this.audioContext) {
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        // Create audio source from element
        const source = this.audioContext.createMediaElementSource(audioElement);

        // Create analyser
        this.analyser = this.audioContext.createAnalyser();
        this.analyser.fftSize = 256;
        this.analyser.smoothingTimeConstant = 0.8;

        // Connect: source -> analyser -> destination
        source.connect(this.analyser);
        this.analyser.connect(this.audioContext.destination);

        // Create data array for frequency data
        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

        this.isAnalyzing = true;
        console.log('Audio connected for lip-sync');
      }

      analyzeMouth() {
        if (!this.isAnalyzing || !this.analyser) {
          return 'closed';
        }

        this.analyser.getByteFrequencyData(this.dataArray);

        // Calculate RMS (volume)
        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
          sum += this.dataArray[i] * this.dataArray[i];
        }
        const rms = Math.sqrt(sum / this.dataArray.length);

        // Calculate frequency ratio (low vs high)
        const midPoint = Math.floor(this.dataArray.length / 2);
        let lowSum = 0, highSum = 0;
        for (let i = 0; i < midPoint; i++) {
          lowSum += this.dataArray[i];
        }
        for (let i = midPoint; i < this.dataArray.length; i++) {
          highSum += this.dataArray[i];
        }
        const freqRatio = lowSum / (highSum + 1);

        // Update debug info
        this.updateDebug(`RMS: ${rms.toFixed(1)} | Ratio: ${freqRatio.toFixed(2)}`);

        // Determine mouth state based on audio analysis
        if (rms < 10) {
          return 'closed';
        } else if (rms < 30) {
          return 'half';
        } else if (freqRatio > 2) {
          return 'u'; // Low frequencies = 'u' shape
        } else if (freqRatio < 0.8) {
          return 'e'; // High frequencies = 'e' shape
        } else {
          return 'open';
        }
      }

      render() {
        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Analyze audio and get mouth state
        const mouthState = this.analyzeMouth();

        // Get current mouth position (per-frame or static)
        let mouthX, mouthY, mouthWidth, mouthRotation;

        if (this.usePerFrameTracking) {
          // Get frame-synchronized position
          const frameIndex = this.getCurrentFrameIndex();
          const quad = this.mouthTrack.getQuad(frameIndex);

          if (quad) {
            // Calculate position from quad
            const pos = this.mouthTrack.getPositionFromQuad(quad, this.video.videoWidth, this.video.videoHeight);

            // Convert to canvas coordinates (accounting for object-fit: contain)
            const videoAspect = this.video.videoWidth / this.video.videoHeight;
            const canvasAspect = this.canvas.width / this.canvas.height;

            let videoDisplayWidth, videoDisplayHeight, offsetX, offsetY;

            if (videoAspect > canvasAspect) {
              // Video is wider - letterbox top/bottom
              videoDisplayWidth = this.canvas.width;
              videoDisplayHeight = this.canvas.width / videoAspect;
              offsetX = 0;
              offsetY = (this.canvas.height - videoDisplayHeight) / 2;
            } else {
              // Video is taller - letterbox left/right
              videoDisplayHeight = this.canvas.height;
              videoDisplayWidth = this.canvas.height * videoAspect;
              offsetX = (this.canvas.width - videoDisplayWidth) / 2;
              offsetY = 0;
            }

            mouthX = offsetX + pos.x * videoDisplayWidth;
            mouthY = offsetY + pos.y * videoDisplayHeight;
            mouthWidth = pos.scale * videoDisplayWidth;
            mouthRotation = pos.rotation;

            // Update debug info with frame tracking
            if (this.debugInfo.classList.contains('visible')) {
              this.updateDebug(`Frame: ${frameIndex} | Pos: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)})`);
            }
          } else {
            // Fallback to static position
            mouthX = this.canvas.width * this.mouthPosition.x;
            mouthY = this.canvas.height * this.mouthPosition.y;
            mouthWidth = this.canvas.width * this.mouthScale;
            mouthRotation = 0;
          }
        } else {
          // Use static position
          mouthX = this.canvas.width * this.mouthPosition.x;
          mouthY = this.canvas.height * this.mouthPosition.y;
          mouthWidth = this.canvas.width * this.mouthScale;
          mouthRotation = 0;
        }

        // Draw mouth sprite if available
        const sprite = this.mouthSprites[mouthState];
        if (sprite) {
          const mouthHeight = mouthWidth * (sprite.height / sprite.width);

          // Save context for rotation
          this.ctx.save();

          // Apply rotation around mouth center
          if (mouthRotation !== 0) {
            this.ctx.translate(mouthX, mouthY);
            this.ctx.rotate(mouthRotation);
            this.ctx.translate(-mouthX, -mouthY);
          }

          this.ctx.drawImage(
            sprite,
            mouthX - mouthWidth / 2,
            mouthY - mouthHeight / 2,
            mouthWidth,
            mouthHeight
          );

          // Restore context
          this.ctx.restore();
        }

        this.currentMouth = mouthState;

        // Continue render loop
        requestAnimationFrame(() => this.render());
      }

      updateDebug(text) {
        if (this.debugInfo) {
          this.debugInfo.textContent = text;
        }
      }

      showPlaceholder(message) {
        const container = document.getElementById('pngtuber-container');
        container.innerHTML = `
          <div style="color:#fff; background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px; font-family:Arial; font-size:12px; border-radius:8px; text-align:center;
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80%;">
            <strong>PNGTuber Mode</strong><br><br>
            ${message}<br><br>
            <small>Coloca los archivos en:<br>assets/pngtuber/</small>
          </div>
        `;
      }

      // Set mouth position (can be loaded from tracking.json)
      setMouthPosition(x, y, scale) {
        this.mouthPosition = { x, y };
        if (scale) this.mouthScale = scale;
      }

      stopAnalysis() {
        this.isAnalyzing = false;
      }

      startAnalysis() {
        this.isAnalyzing = true;
      }
    }

    // ============================================
    // CHAT MODULE (same as GLB version)
    // ============================================

    const WEBHOOK_URL = 'https://n8n.srv775163.hstgr.cloud/webhook/desktop-avatar';

    let isChatOpen = false;
    let isProcessing = false;
    let pngtuber = null;

    const chatToggle = document.getElementById('chat-toggle');
    const chatBox = document.getElementById('chat-box');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const ttsAudio = document.getElementById('tts-audio');

    function initChat() {
      chatToggle.addEventListener('click', toggleChat);
      chatSend.addEventListener('click', sendMessage);
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Audio events for lip-sync
      ttsAudio.addEventListener('play', () => {
        console.log('Audio playing - start lip-sync');
        if (pngtuber && !pngtuber.analyser) {
          pngtuber.connectAudio(ttsAudio);
        }
        pngtuber?.startAnalysis();
      });

      ttsAudio.addEventListener('ended', () => {
        console.log('Audio ended - stop lip-sync');
        pngtuber?.stopAnalysis();
      });

      ttsAudio.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        addMessage('Error reproduciendo audio', 'system');
      });

      console.log('Chat initialized');
    }

    function toggleChat() {
      isChatOpen = !isChatOpen;
      chatBox.classList.toggle('visible', isChatOpen);
      if (isChatOpen) {
        chatInput.focus();
      }
    }

    function addMessage(text, type = 'user') {
      const msg = document.createElement('div');
      msg.className = `chat-message ${type}`;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showLoading() {
      const loading = document.createElement('div');
      loading.className = 'chat-loading';
      loading.id = 'chat-loading';
      loading.innerHTML = '<span></span><span></span><span></span>';
      chatMessages.appendChild(loading);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideLoading() {
      const loading = document.getElementById('chat-loading');
      if (loading) loading.remove();
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isProcessing) return;

      addMessage(text, 'user');
      chatInput.value = '';

      isProcessing = true;
      chatSend.disabled = true;
      showLoading();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const audioBlob = await response.blob();
        console.log('Received audio:', audioBlob.type, audioBlob.size, 'bytes');

        const audioUrl = URL.createObjectURL(audioBlob);
        ttsAudio.src = audioUrl;
        await ttsAudio.play();

      } catch (error) {
        console.error('Chat error:', error);
        addMessage(`Error: ${error.message}`, 'system');
      } finally {
        hideLoading();
        isProcessing = false;
        chatSend.disabled = false;
      }
    }

    // ============================================
    // DRAG CONTROLS
    // ============================================

    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    function setupDragControls() {
      const container = document.getElementById('pngtuber-container');

      container.onmousedown = async (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        const pos = await ipcRenderer.invoke('get-avatar-position');
        dragOffset.x = e.screenX - pos.x;
        dragOffset.y = e.screenY - pos.y;
      };

      document.onmousemove = async (e) => {
        if (!isDragging) return;
        await ipcRenderer.invoke('set-avatar-position', {
          x: e.screenX - dragOffset.x,
          y: e.screenY - dragOffset.y
        });
      };

      document.onmouseup = () => isDragging = false;
    }

    // ============================================
    // CALIBRATION MODULE WITH KEYFRAME SUPPORT
    // ============================================

    let isCalibrating = false;
    let calibrationPos = { x: 0.5, y: 0.7 };
    let calibrationScale = 15; // percentage

    // Keyframe tracking
    let keyframes = {}; // { frameIndex: { x, y, scale } }
    let totalFrames = 0;
    let currentFrame = 0;
    let isVideoPlaying = false;

    const calibrateBtn = document.getElementById('calibrate-btn');
    const calibrationOverlay = document.getElementById('calibration-overlay');
    const calibrationArea = document.getElementById('calibration-area');
    const mouthMarker = document.getElementById('mouth-marker');
    const scaleSlider = document.getElementById('scale-slider');
    const scaleValue = document.getElementById('scale-value');
    const saveCalibration = document.getElementById('save-calibration');
    const cancelCalibration = document.getElementById('cancel-calibration');

    // Frame control elements
    const framePrev10 = document.getElementById('frame-prev-10');
    const framePrev = document.getElementById('frame-prev');
    const framePlay = document.getElementById('frame-play');
    const frameNext = document.getElementById('frame-next');
    const frameNext10 = document.getElementById('frame-next-10');
    const frameSlider = document.getElementById('frame-slider');
    const frameInfo = document.getElementById('frame-info');
    const addKeyframeBtn = document.getElementById('add-keyframe');
    const keyframeCount = document.getElementById('keyframe-count');
    const keyframeMarkers = document.getElementById('keyframe-markers');

    function initCalibration() {
      // Open calibration mode
      calibrateBtn.addEventListener('click', () => {
        openCalibrationMode();
      });

      // Click to position mouth
      calibrationArea.addEventListener('click', (e) => {
        const rect = calibrationArea.getBoundingClientRect();
        calibrationPos.x = e.clientX / rect.width;
        calibrationPos.y = e.clientY / rect.height;
        updateMarkerPosition();
      });

      // Drag support for marker
      let isDraggingMarker = false;
      calibrationArea.addEventListener('mousedown', (e) => {
        isDraggingMarker = true;
      });

      calibrationArea.addEventListener('mousemove', (e) => {
        if (!isDraggingMarker) return;
        const rect = calibrationArea.getBoundingClientRect();
        calibrationPos.x = Math.max(0, Math.min(1, e.clientX / rect.width));
        calibrationPos.y = Math.max(0, Math.min(1, e.clientY / rect.height));
        updateMarkerPosition();
        // Live preview
        if (pngtuber) {
          pngtuber.setMouthPosition(calibrationPos.x, calibrationPos.y, calibrationScale / 100);
        }
      });

      calibrationArea.addEventListener('mouseup', () => {
        isDraggingMarker = false;
      });

      // Scale slider
      scaleSlider.addEventListener('input', (e) => {
        calibrationScale = parseInt(e.target.value);
        scaleValue.textContent = `${calibrationScale}%`;
        mouthMarker.style.width = `${calibrationScale * 3}px`;
        mouthMarker.style.height = `${calibrationScale * 3}px`;
        // Live preview
        if (pngtuber) {
          pngtuber.setMouthPosition(calibrationPos.x, calibrationPos.y, calibrationScale / 100);
        }
      });

      // Frame navigation controls
      framePrev10.addEventListener('click', () => seekFrame(-10));
      framePrev.addEventListener('click', () => seekFrame(-1));
      frameNext.addEventListener('click', () => seekFrame(1));
      frameNext10.addEventListener('click', () => seekFrame(10));

      framePlay.addEventListener('click', toggleVideoPlay);

      frameSlider.addEventListener('input', (e) => {
        const frame = parseInt(e.target.value);
        goToFrame(frame);
      });

      // Add keyframe button
      addKeyframeBtn.addEventListener('click', addKeyframe);

      // Save button
      saveCalibration.addEventListener('click', () => {
        saveCalibrationData();
        closeCalibrationMode();
      });

      // Cancel button
      cancelCalibration.addEventListener('click', () => {
        closeCalibrationMode();
        // Restore video playback
        if (pngtuber && pngtuber.video) {
          pngtuber.video.play();
        }
        // Reload tracking data
        reloadTrackingData();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (!isCalibrating) return;

        switch(e.key) {
          case 'ArrowLeft':
            seekFrame(e.shiftKey ? -10 : -1);
            e.preventDefault();
            break;
          case 'ArrowRight':
            seekFrame(e.shiftKey ? 10 : 1);
            e.preventDefault();
            break;
          case ' ':
            toggleVideoPlay();
            e.preventDefault();
            break;
          case 'k':
          case 'K':
            addKeyframe();
            e.preventDefault();
            break;
        }
      });
    }

    function openCalibrationMode() {
      isCalibrating = true;
      calibrationOverlay.classList.add('visible');

      // Pause video for frame-by-frame control
      if (pngtuber && pngtuber.video) {
        pngtuber.video.pause();
        isVideoPlaying = false;
        framePlay.textContent = '▶';

        // Calculate total frames
        const duration = pngtuber.video.duration;
        const fps = pngtuber.videoFPS || 30;
        totalFrames = Math.floor(duration * fps);

        // Setup frame slider
        frameSlider.max = totalFrames - 1;
        frameSlider.value = 0;

        // Go to first frame
        goToFrame(0);
      }

      // Load existing keyframes from tracking data
      loadExistingKeyframes();

      // Set initial marker position
      if (pngtuber) {
        calibrationPos = { ...pngtuber.mouthPosition };
        calibrationScale = pngtuber.mouthScale * 100;
      }

      scaleSlider.value = calibrationScale;
      scaleValue.textContent = `${Math.round(calibrationScale)}%`;
      updateMarkerPosition();
      updateKeyframeMarkers();
    }

    function closeCalibrationMode() {
      isCalibrating = false;
      calibrationOverlay.classList.remove('visible');

      // Resume video playback
      if (pngtuber && pngtuber.video) {
        pngtuber.video.play();
      }
    }

    function seekFrame(delta) {
      const newFrame = Math.max(0, Math.min(totalFrames - 1, currentFrame + delta));
      goToFrame(newFrame);
    }

    function goToFrame(frameIndex) {
      if (!pngtuber || !pngtuber.video) return;

      currentFrame = frameIndex;
      const fps = pngtuber.videoFPS || 30;
      const time = frameIndex / fps;

      pngtuber.video.currentTime = time;
      frameSlider.value = frameIndex;
      frameInfo.textContent = `${frameIndex} / ${totalFrames - 1}`;

      // Update mouth position based on interpolated keyframes
      const interpolatedPos = getInterpolatedPosition(frameIndex);
      calibrationPos.x = interpolatedPos.x;
      calibrationPos.y = interpolatedPos.y;
      calibrationScale = interpolatedPos.scale * 100;

      scaleSlider.value = calibrationScale;
      scaleValue.textContent = `${Math.round(calibrationScale)}%`;
      updateMarkerPosition();

      // Live preview
      if (pngtuber) {
        pngtuber.setMouthPosition(calibrationPos.x, calibrationPos.y, calibrationScale / 100);
      }

      // Highlight if this frame is a keyframe
      if (keyframes[frameIndex]) {
        addKeyframeBtn.classList.add('active');
        addKeyframeBtn.textContent = '✓ Keyframe';
      } else {
        addKeyframeBtn.classList.remove('active');
        addKeyframeBtn.textContent = '+ Keyframe';
      }
    }

    function toggleVideoPlay() {
      if (!pngtuber || !pngtuber.video) return;

      if (isVideoPlaying) {
        pngtuber.video.pause();
        framePlay.textContent = '▶';
      } else {
        pngtuber.video.play();
        framePlay.textContent = '⏸';
        // Update frame position during playback
        requestAnimationFrame(updateFrameDuringPlayback);
      }
      isVideoPlaying = !isVideoPlaying;
    }

    function updateFrameDuringPlayback() {
      if (!isVideoPlaying || !isCalibrating) return;

      const fps = pngtuber.videoFPS || 30;
      currentFrame = Math.floor(pngtuber.video.currentTime * fps);
      frameSlider.value = currentFrame;
      frameInfo.textContent = `${currentFrame} / ${totalFrames - 1}`;

      requestAnimationFrame(updateFrameDuringPlayback);
    }

    function addKeyframe() {
      // Toggle keyframe at current frame
      if (keyframes[currentFrame]) {
        // Remove keyframe
        delete keyframes[currentFrame];
        addKeyframeBtn.classList.remove('active');
        addKeyframeBtn.textContent = '+ Keyframe';
      } else {
        // Add keyframe with current position
        keyframes[currentFrame] = {
          x: calibrationPos.x,
          y: calibrationPos.y,
          scale: calibrationScale / 100
        };
        addKeyframeBtn.classList.add('active');
        addKeyframeBtn.textContent = '✓ Keyframe';
      }

      updateKeyframeMarkers();
      keyframeCount.textContent = `${Object.keys(keyframes).length} keys`;
    }

    function updateKeyframeMarkers() {
      keyframeMarkers.innerHTML = '';
      const keys = Object.keys(keyframes).map(Number).sort((a, b) => a - b);

      keys.forEach(frame => {
        const dot = document.createElement('div');
        dot.className = 'keyframe-dot';
        dot.style.left = `${(frame / (totalFrames - 1)) * 100}%`;
        dot.title = `Frame ${frame}`;
        keyframeMarkers.appendChild(dot);
      });

      keyframeCount.textContent = `${keys.length} keys`;
    }

    function getInterpolatedPosition(frameIndex) {
      const keys = Object.keys(keyframes).map(Number).sort((a, b) => a - b);

      if (keys.length === 0) {
        // No keyframes, return default
        return { x: 0.5, y: 0.7, scale: 0.15 };
      }

      if (keys.length === 1) {
        // Only one keyframe, use it for all frames
        return keyframes[keys[0]];
      }

      // Find surrounding keyframes
      let prevKey = null;
      let nextKey = null;

      for (let i = 0; i < keys.length; i++) {
        if (keys[i] <= frameIndex) {
          prevKey = keys[i];
        }
        if (keys[i] >= frameIndex && nextKey === null) {
          nextKey = keys[i];
        }
      }

      // Handle edge cases
      if (prevKey === null) {
        // Before first keyframe - also check wrap-around
        const lastKey = keys[keys.length - 1];
        const firstKey = keys[0];

        // Interpolate from last keyframe (wrapping around)
        const wrapDistance = (totalFrames - lastKey) + frameIndex;
        const totalDistance = (totalFrames - lastKey) + firstKey;
        const t = wrapDistance / totalDistance;

        return interpolateKeyframes(keyframes[lastKey], keyframes[firstKey], t);
      }

      if (nextKey === null) {
        // After last keyframe - wrap to first
        const lastKey = keys[keys.length - 1];
        const firstKey = keys[0];

        const wrapDistance = frameIndex - lastKey;
        const totalDistance = (totalFrames - lastKey) + firstKey;
        const t = wrapDistance / totalDistance;

        return interpolateKeyframes(keyframes[lastKey], keyframes[firstKey], t);
      }

      if (prevKey === nextKey) {
        // Exact match
        return keyframes[prevKey];
      }

      // Interpolate between prev and next
      const t = (frameIndex - prevKey) / (nextKey - prevKey);
      return interpolateKeyframes(keyframes[prevKey], keyframes[nextKey], t);
    }

    function interpolateKeyframes(a, b, t) {
      // Smooth interpolation using ease-in-out
      const smoothT = t * t * (3 - 2 * t);

      return {
        x: a.x + (b.x - a.x) * smoothT,
        y: a.y + (b.y - a.y) * smoothT,
        scale: a.scale + (b.scale - a.scale) * smoothT
      };
    }

    function loadExistingKeyframes() {
      keyframes = {};

      // Try to load from existing tracking.json
      const trackingPath = path.join(__dirname, '../../assets/pngtuber/tracking.json');
      if (fs.existsSync(trackingPath)) {
        try {
          const data = JSON.parse(fs.readFileSync(trackingPath, 'utf8'));

          if (data.keyframes) {
            // Load keyframe data
            keyframes = data.keyframes;
          } else if (data.mouth) {
            // Convert static position to keyframe at frame 0
            keyframes[0] = {
              x: data.mouth.x,
              y: data.mouth.y,
              scale: data.mouth.scale
            };
          }
        } catch (e) {
          console.log('Error loading existing keyframes:', e);
        }
      }

      updateKeyframeMarkers();
    }

    function updateMarkerPosition() {
      const rect = calibrationArea.getBoundingClientRect();
      mouthMarker.style.left = `${calibrationPos.x * rect.width}px`;
      mouthMarker.style.top = `${calibrationPos.y * rect.height}px`;
      mouthMarker.style.width = `${calibrationScale * 3}px`;
      mouthMarker.style.height = `${calibrationScale * 3}px`;
    }

    function saveCalibrationData() {
      const trackingPath = path.join(__dirname, '../../assets/pngtuber/tracking.json');
      const keys = Object.keys(keyframes).map(Number).sort((a, b) => a - b);

      let trackingData;

      if (keys.length > 1) {
        // Multiple keyframes - save for per-frame interpolation
        // Generate full frame data by interpolating all frames
        const frames = [];
        const fps = pngtuber?.videoFPS || 30;

        for (let i = 0; i < totalFrames; i++) {
          const pos = getInterpolatedPosition(i);
          // Store as quad format (4 corners) for compatibility
          const w = pos.scale * (pngtuber?.video?.videoWidth || 640);
          const h = w * 0.5; // Assume mouth height is half of width
          const cx = pos.x * (pngtuber?.video?.videoWidth || 640);
          const cy = pos.y * (pngtuber?.video?.videoHeight || 480);

          frames.push([
            { x: cx - w/2, y: cy - h/2 },  // top-left
            { x: cx + w/2, y: cy - h/2 },  // top-right
            { x: cx + w/2, y: cy + h/2 },  // bottom-right
            { x: cx - w/2, y: cy + h/2 }   // bottom-left
          ]);
        }

        trackingData = {
          keyframes: keyframes,
          frames: frames,
          fps: fps,
          totalFrames: totalFrames,
          videoWidth: pngtuber?.video?.videoWidth || 640,
          videoHeight: pngtuber?.video?.videoHeight || 480,
          savedAt: new Date().toISOString()
        };
      } else {
        // Single or no keyframe - save as static position
        const pos = keys.length === 1 ? keyframes[keys[0]] : { x: calibrationPos.x, y: calibrationPos.y, scale: calibrationScale / 100 };

        trackingData = {
          mouth: {
            x: pos.x,
            y: pos.y,
            scale: pos.scale
          },
          keyframes: keyframes,
          savedAt: new Date().toISOString()
        };
      }

      try {
        fs.writeFileSync(trackingPath, JSON.stringify(trackingData, null, 2));
        console.log('Calibration saved:', trackingData);

        // Reload tracking data to apply changes
        reloadTrackingData();

        // Show success feedback
        const keyCount = keys.length;
        showCalibrationFeedback(keyCount > 1
          ? `✓ Guardado: ${keyCount} keyframes (tracking dinámico)`
          : '✓ Posición guardada');
      } catch (e) {
        console.error('Error saving calibration:', e);
        showCalibrationFeedback('✗ Error al guardar');
      }
    }

    async function reloadTrackingData() {
      if (pngtuber) {
        const videoWidth = pngtuber.video?.videoWidth || 640;
        const videoHeight = pngtuber.video?.videoHeight || 480;
        await pngtuber.loadTrackingData(videoWidth, videoHeight);
      }
    }

    function loadTrackingData() {
      const trackingPath = path.join(__dirname, '../../assets/pngtuber/tracking.json');
      if (fs.existsSync(trackingPath)) {
        try {
          const tracking = JSON.parse(fs.readFileSync(trackingPath, 'utf8'));
          if (tracking.mouth && pngtuber) {
            pngtuber.setMouthPosition(
              tracking.mouth.x,
              tracking.mouth.y,
              tracking.mouth.scale
            );
          }
          console.log('Loaded tracking data');
        } catch (e) {
          console.log('Error loading tracking data:', e);
        }
      }
    }

    function showCalibrationFeedback(message) {
      const feedback = document.createElement('div');
      feedback.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 15px 25px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        z-index: 2000;
        animation: fadeInOut 2s ease;
      `;
      feedback.textContent = message;
      document.body.appendChild(feedback);

      setTimeout(() => feedback.remove(), 2000);
    }

    // Add animation keyframes
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeInOut {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      }
    `;
    document.head.appendChild(style);

    // ============================================
    // INITIALIZE
    // ============================================

    async function init() {
      console.log('=== Desktop Avatar (PNGTuber Mode) ===');

      // Initialize PNGTuber engine
      pngtuber = new PNGTuberEngine();
      await pngtuber.init();

      // Load tracking data if available
      const trackingPath = path.join(__dirname, '../../assets/pngtuber/tracking.json');
      if (fs.existsSync(trackingPath)) {
        try {
          const tracking = JSON.parse(fs.readFileSync(trackingPath, 'utf8'));
          if (tracking.mouth) {
            pngtuber.setMouthPosition(
              tracking.mouth.x,
              tracking.mouth.y,
              tracking.mouth.scale
            );
          }
          console.log('Loaded tracking data');
        } catch (e) {
          console.log('No tracking data loaded');
        }
      }

      // Initialize chat, drag, and calibration
      initChat();
      setupDragControls();
      initCalibration();

      console.log('PNGTuber Avatar ready!');
    }

    // Start
    init();
  </script>
