<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Avatar - PNGTuber</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* PNGTuber specific styles */
    #pngtuber-container {
      width: 200px;
      height: 100%;
      position: absolute;
      right: 0;
      top: 0;
      background: transparent;
      cursor: grab;
      -webkit-app-region: drag;
    }

    #avatar-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
    }

    #mouth-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #debug-info {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 5px;
      font-family: monospace;
      font-size: 10px;
      border-radius: 3px;
      display: none;
    }

    #debug-info.visible {
      display: block;
    }

    /* Settings button */
    #settings-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      cursor: pointer;
      z-index: 1000;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity 0.3s, transform 0.2s;
    }

    #settings-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    #settings-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    /* Settings dropdown menu */
    #settings-menu {
      position: fixed;
      top: 50px;
      right: 10px;
      background: linear-gradient(135deg, #2d2d3a, #1a1a24);
      border-radius: 10px;
      padding: 8px 0;
      min-width: 200px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1001;
      display: none;
      -webkit-app-region: no-drag;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #settings-menu.visible {
      display: block;
      animation: menuFadeIn 0.2s ease;
    }

    @keyframes menuFadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-section {
      padding: 4px 12px;
      margin-bottom: 4px;
    }

    .menu-section-title {
      color: #888;
      font-family: Arial, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background: rgba(102, 126, 234, 0.3);
    }

    .menu-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      opacity: 0.8;
    }

    .menu-item .icon-python {
      color: #3776ab;
    }

    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 8px 0;
    }

    .menu-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .menu-item.disabled:hover {
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="pngtuber-container">
    <video id="avatar-video" loop muted playsinline></video>
    <canvas id="mouth-canvas"></canvas>
    <div id="debug-info"></div>
  </div>

  <!-- Settings Button -->
  <button id="settings-btn" title="Configuración">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>

  <!-- Chat Box -->
  <div id="chat-container">
    <div id="chat-box">
      <div id="chat-messages"></div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type here..." autocomplete="off">
        <button id="chat-voice" title="Mensaje de voz">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>

  <!-- Audio element for TTS playback -->
  <audio id="tts-audio" style="display:none;" crossorigin="anonymous"></audio>

  <script>
    const fs = require('fs');
    const path = require('path');
    const zlib = require('zlib');
    const { ipcRenderer } = require('electron');
    const { spawn } = require('child_process');

    // ============================================
    // NPZ/NPY PARSER (for MotionPNGTuber compatibility)
    // ============================================

    class NPZParser {
      /**
       * Parse NPY format buffer (NumPy binary format)
       * Format: magic string + version + header_len + header (dict) + data
       */
      static parseNPY(buffer) {
        const view = new DataView(buffer.buffer || buffer);

        // Check magic number: \x93NUMPY
        const magic = String.fromCharCode(buffer[0], buffer[1], buffer[2], buffer[3], buffer[4], buffer[5]);
        if (magic !== '\x93NUMPY') {
          throw new Error('Invalid NPY file: wrong magic number');
        }

        // Version
        const majorVersion = buffer[6];
        const minorVersion = buffer[7];

        // Header length (depends on version)
        let headerLen, headerOffset;
        if (majorVersion === 1) {
          headerLen = view.getUint16(8, true); // little-endian
          headerOffset = 10;
        } else {
          headerLen = view.getUint32(8, true); // little-endian
          headerOffset = 12;
        }

        // Parse header (Python dict-like string)
        const headerStr = new TextDecoder().decode(buffer.slice(headerOffset, headerOffset + headerLen));
        const header = this.parseNPYHeader(headerStr);

        // Data starts after header
        const dataOffset = headerOffset + headerLen;
        const dataBuffer = buffer.slice(dataOffset);

        // Parse data based on dtype
        return this.parseNPYData(dataBuffer, header);
      }

      static parseNPYHeader(headerStr) {
        // Parse Python dict-like header: {'descr': '<f4', 'fortran_order': False, 'shape': (100, 4, 2)}
        const descrMatch = headerStr.match(/'descr':\s*'([^']+)'/);
        const shapeMatch = headerStr.match(/'shape':\s*\(([^)]+)\)/);
        const fortranMatch = headerStr.match(/'fortran_order':\s*(True|False)/);

        const dtype = descrMatch ? descrMatch[1] : '<f8';
        const shapeStr = shapeMatch ? shapeMatch[1] : '';
        const shape = shapeStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
        const fortranOrder = fortranMatch ? fortranMatch[1] === 'True' : false;

        return { dtype, shape, fortranOrder };
      }

      static parseNPYData(buffer, header) {
        const { dtype, shape } = header;
        const totalElements = shape.reduce((a, b) => a * b, 1);

        let data;
        const view = new DataView(buffer.buffer || buffer);

        // Parse based on dtype
        if (dtype.includes('f4') || dtype.includes('float32')) {
          // float32
          data = new Float32Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getFloat32(i * 4, dtype[0] === '<');
          }
        } else if (dtype.includes('f8') || dtype.includes('float64')) {
          // float64
          data = new Float64Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getFloat64(i * 8, dtype[0] === '<');
          }
        } else if (dtype.includes('i4') || dtype.includes('int32')) {
          // int32
          data = new Int32Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getInt32(i * 4, dtype[0] === '<');
          }
        } else if (dtype.includes('b1') || dtype.includes('bool')) {
          // boolean
          data = new Uint8Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = buffer[i];
          }
        } else if (dtype.includes('u1') || dtype.includes('uint8')) {
          // uint8
          data = new Uint8Array(buffer.slice(0, totalElements));
        } else {
          // Default to float64
          data = new Float64Array(totalElements);
          for (let i = 0; i < totalElements; i++) {
            data[i] = view.getFloat64(i * 8, true);
          }
        }

        return { data, shape, dtype };
      }

      /**
       * Load NPZ file (ZIP archive of NPY files)
       */
      static loadNPZ(filePath) {
        const fileBuffer = fs.readFileSync(filePath);
        const entries = {};

        // NPZ is a ZIP file - parse it manually
        let offset = 0;
        while (offset < fileBuffer.length - 4) {
          // Look for local file header signature: PK\x03\x04
          if (fileBuffer[offset] !== 0x50 || fileBuffer[offset + 1] !== 0x4B ||
              fileBuffer[offset + 2] !== 0x03 || fileBuffer[offset + 3] !== 0x04) {
            break;
          }

          const view = new DataView(fileBuffer.buffer, offset);

          // Parse local file header
          const compressionMethod = view.getUint16(8, true);
          const compressedSize = view.getUint32(18, true);
          const uncompressedSize = view.getUint32(22, true);
          const fileNameLen = view.getUint16(26, true);
          const extraFieldLen = view.getUint16(28, true);

          const headerSize = 30;
          const fileName = fileBuffer.slice(offset + headerSize, offset + headerSize + fileNameLen).toString('utf8');
          const dataStart = offset + headerSize + fileNameLen + extraFieldLen;
          const compressedData = fileBuffer.slice(dataStart, dataStart + compressedSize);

          // Decompress if needed
          let data;
          if (compressionMethod === 0) {
            // No compression
            data = compressedData;
          } else if (compressionMethod === 8) {
            // Deflate
            data = zlib.inflateRawSync(compressedData);
          } else {
            console.warn(`Unknown compression method ${compressionMethod} for ${fileName}`);
            offset = dataStart + compressedSize;
            continue;
          }

          // Parse NPY data if it's a .npy file
          const baseName = fileName.replace('.npy', '');
          if (fileName.endsWith('.npy')) {
            try {
              entries[baseName] = this.parseNPY(data);
            } catch (e) {
              console.warn(`Error parsing ${fileName}:`, e);
            }
          }

          offset = dataStart + compressedSize;
        }

        return entries;
      }
    }

    // ============================================
    // MOUTH TRACK DATA (per-frame tracking)
    // ============================================

    class MouthTrack {
      constructor() {
        this.quads = null;      // Array of quad coordinates per frame (N x 4 x 2)
        this.valid = null;      // Boolean array indicating valid frames
        this.totalFrames = 0;
        this.srcWidth = 0;
        this.srcHeight = 0;
        this.fps = 30;
        this.hasData = false;

        // Fallback static position (used when no NPZ tracking)
        this.staticPosition = { x: 0.5, y: 0.7 };
        this.staticScale = 0.15;
      }

      /**
       * Load tracking data from NPZ file (MotionPNGTuber format)
       */
      loadFromNPZ(filePath, targetWidth, targetHeight) {
        try {
          const npzData = NPZParser.loadNPZ(filePath);

          // Get quad data
          if (npzData.quad) {
            const { data, shape } = npzData.quad;
            this.totalFrames = shape[0];

            // Reshape flat array to [N][4][2] structure
            this.quads = [];
            for (let i = 0; i < this.totalFrames; i++) {
              const quad = [];
              for (let j = 0; j < 4; j++) {
                const idx = (i * 4 + j) * 2;
                quad.push([data[idx], data[idx + 1]]);
              }
              this.quads.push(quad);
            }
          } else if (npzData.bbox) {
            // Alternative: bbox format (x, y, w, h) - convert to quad
            const { data, shape } = npzData.bbox;
            this.totalFrames = shape[0];
            this.quads = [];

            for (let i = 0; i < this.totalFrames; i++) {
              const idx = i * 4;
              const x = data[idx];
              const y = data[idx + 1];
              const w = data[idx + 2];
              const h = data[idx + 3];

              // Convert bbox to quad (4 corners)
              this.quads.push([
                [x, y],           // top-left
                [x + w, y],       // top-right
                [x + w, y + h],   // bottom-right
                [x, y + h]        // bottom-left
              ]);
            }
          }

          // Get valid flags
          if (npzData.valid) {
            this.valid = Array.from(npzData.valid.data);
          } else {
            this.valid = new Array(this.totalFrames).fill(1);
          }

          // Get source dimensions
          this.srcWidth = npzData.w?.data?.[0] || targetWidth;
          this.srcHeight = npzData.h?.data?.[0] || targetHeight;

          // Get FPS if available
          if (npzData.fps) {
            this.fps = npzData.fps.data[0];
          }

          // Scale quads to target dimensions
          if (this.quads && (this.srcWidth !== targetWidth || this.srcHeight !== targetHeight)) {
            const scaleX = targetWidth / this.srcWidth;
            const scaleY = targetHeight / this.srcHeight;

            for (let i = 0; i < this.quads.length; i++) {
              for (let j = 0; j < 4; j++) {
                this.quads[i][j][0] *= scaleX;
                this.quads[i][j][1] *= scaleY;
              }
            }
          }

          // Fill invalid frames by holding previous valid
          this.fillInvalidFrames();

          this.hasData = this.quads && this.quads.length > 0;
          console.log(`Loaded NPZ tracking: ${this.totalFrames} frames, hasData: ${this.hasData}`);
          return true;
        } catch (e) {
          console.error('Error loading NPZ:', e);
          return false;
        }
      }

      /**
       * Load tracking from JSON file (multiple formats supported)
       * MotionPNGTuber format: { frames: [{quad: [[x,y],...], valid: bool}, ...], calibration: {...} }
       * Python tool format: { quads: [[[x,y], ...], ...], fps: 30, calibration: {...} }
       * Static: { mouth: {x, y, scale}, fps: 30 }
       */
      loadFromJSON(filePath, targetWidth, targetHeight) {
        try {
          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));

          // Store calibration if present
          if (data.calibration) {
            this.calibration = data.calibration;
            console.log('Loaded calibration from tracking file:', this.calibration);
          }

          // Store reference sprite size if present
          if (data.refSpriteSize) {
            this.refSpriteSize = data.refSpriteSize;
          }

          // Source dimensions
          this.srcWidth = data.width || targetWidth;
          this.srcHeight = data.height || targetHeight;
          this.fps = data.fps || 30;

          // MotionPNGTuber format: frames array with {quad, valid} objects
          if (data.frames && Array.isArray(data.frames) && data.frames.length > 0 && data.frames[0].quad) {
            this.totalFrames = data.frames.length;
            this.quads = [];
            this.valid = [];

            for (const frame of data.frames) {
              if (frame.quad && Array.isArray(frame.quad) && frame.quad.length === 4) {
                this.quads.push(frame.quad.map(p => [p[0], p[1]]));
                this.valid.push(frame.valid !== false);
              } else {
                this.quads.push(null);
                this.valid.push(false);
              }
            }

            this.hasData = true;
            this._applyScaleAndCalibration(targetWidth, targetHeight);
            this.fillInvalidFrames();
            console.log(`Loaded MotionPNGTuber tracking: ${this.totalFrames} frames`);
            return true;
          }

          // Python tool format with quads array
          if (data.quads && Array.isArray(data.quads)) {
            this.totalFrames = data.quads.length;
            this.quads = data.quads.map(quad => {
              if (Array.isArray(quad) && quad.length === 4) {
                return quad.map(p => {
                  if (Array.isArray(p)) return [p[0], p[1]];
                  if (p && typeof p === 'object') return [p.x, p.y];
                  return null;
                });
              }
              return null;
            });
            this.valid = data.valid || this.quads.map(q => q !== null);
            this.hasData = true;
            this._applyScaleAndCalibration(targetWidth, targetHeight);
            this.fillInvalidFrames();
            console.log(`Loaded Python tool tracking: ${this.totalFrames} frames`);
            return true;
          }

          // Legacy format with frames as direct quad arrays
          if (data.frames && Array.isArray(data.frames)) {
            this.totalFrames = data.frames.length;
            this.quads = data.frames.map(frame => {
              if (Array.isArray(frame) && frame.length === 4) {
                return frame.map(p => [p.x || p[0], p.y || p[1]]);
              }
              return null;
            });
            this.valid = this.quads.map(q => q !== null);
            this.hasData = true;
            this._applyScaleAndCalibration(targetWidth, targetHeight);
            this.fillInvalidFrames();
            return true;
          }

          // Static position fallback
          if (data.mouth) {
            this.staticPosition = { x: data.mouth.x, y: data.mouth.y };
            this.staticScale = data.mouth.scale || 0.15;
          }

          return false;
        } catch (e) {
          console.log('Error loading JSON tracking:', e);
          return false;
        }
      }

      /**
       * Apply scale and calibration to quads
       */
      _applyScaleAndCalibration(targetWidth, targetHeight) {
        if (!this.quads) return;

        // Calculate scale factors
        const scaleX = targetWidth / this.srcWidth;
        const scaleY = targetHeight / this.srcHeight;

        // Get calibration values
        const cal = this.calibration || {};
        const offset = cal.offset || [0, 0];
        const calScale = cal.scale || 1.0;
        const rotation = cal.rotation || 0.0;
        const rotRad = rotation * Math.PI / 180;
        const cosR = Math.cos(rotRad);
        const sinR = Math.sin(rotRad);

        for (let i = 0; i < this.quads.length; i++) {
          if (!this.quads[i]) continue;

          // First scale to target dimensions
          let quad = this.quads[i].map(p => [p[0] * scaleX, p[1] * scaleY]);

          // Apply calibration if present
          if (cal.offset || cal.scale !== 1.0 || cal.rotation !== 0.0) {
            // Calculate quad center
            const cx = quad.reduce((s, p) => s + p[0], 0) / 4;
            const cy = quad.reduce((s, p) => s + p[1], 0) / 4;

            // Apply calibration: translate to origin, scale, rotate, translate back + offset
            quad = quad.map(p => {
              // Translate to origin
              let x = p[0] - cx;
              let y = p[1] - cy;

              // Scale
              x *= calScale;
              y *= calScale;

              // Rotate
              const rx = x * cosR - y * sinR;
              const ry = x * sinR + y * cosR;

              // Translate back + offset (offset also scaled to target)
              return [
                rx + cx + offset[0] * scaleX,
                ry + cy + offset[1] * scaleY
              ];
            });
          }

          this.quads[i] = quad;
        }
      }

      /**
       * Fill invalid frames by holding the last valid frame
       */
      fillInvalidFrames() {
        if (!this.quads || !this.valid) return;

        let lastValid = null;

        // Forward pass - fill with previous valid
        for (let i = 0; i < this.totalFrames; i++) {
          if (this.valid[i]) {
            lastValid = this.quads[i];
          } else if (lastValid) {
            this.quads[i] = JSON.parse(JSON.stringify(lastValid));
          }
        }

        // Backward pass - fill frames before first valid
        lastValid = null;
        for (let i = this.totalFrames - 1; i >= 0; i--) {
          if (this.valid[i]) {
            lastValid = this.quads[i];
          } else if (lastValid && !this.quads[i]) {
            this.quads[i] = JSON.parse(JSON.stringify(lastValid));
          }
        }
      }

      /**
       * Get quad coordinates for a specific frame index
       */
      getQuad(frameIndex) {
        if (!this.hasData || !this.quads) return null;

        const idx = Math.floor(frameIndex) % this.totalFrames;
        return this.quads[idx];
      }

      /**
       * Get center position and scale from quad (for simplified rendering)
       */
      getPositionFromQuad(quad, canvasWidth, canvasHeight) {
        if (!quad) {
          return {
            x: this.staticPosition.x,
            y: this.staticPosition.y,
            scale: this.staticScale,
            rotation: 0
          };
        }

        // Calculate center from quad corners
        const centerX = (quad[0][0] + quad[1][0] + quad[2][0] + quad[3][0]) / 4;
        const centerY = (quad[0][1] + quad[1][1] + quad[2][1] + quad[3][1]) / 4;

        // Calculate width from quad (distance between left and right edges)
        const width = Math.sqrt(
          Math.pow(quad[1][0] - quad[0][0], 2) + Math.pow(quad[1][1] - quad[0][1], 2)
        );

        // Calculate rotation angle
        const angle = Math.atan2(quad[1][1] - quad[0][1], quad[1][0] - quad[0][0]);

        return {
          x: centerX / canvasWidth,
          y: centerY / canvasHeight,
          scale: width / canvasWidth,
          rotation: angle
        };
      }
    }

    class PNGTuberEngine {
      constructor() {
        this.video = document.getElementById('avatar-video');
        this.canvas = document.getElementById('mouth-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.debugInfo = document.getElementById('debug-info');

        // Mouth sprites
        this.mouthSprites = {};
        this.currentMouth = 'closed';

        // Audio analysis
        this.audioContext = null;
        this.analyser = null;
        this.dataArray = null;

        // Lip-sync state
        this.isAnalyzing = false;
        this.mouthPosition = { x: 0.5, y: 0.7 }; // Relative position (fallback)
        this.mouthScale = 0.15; // Relative to video width (fallback)
        this.mouthRotation = 0;

        // Audio analysis arrays (initialized in connectAudio)
        this.timeDataArray = null;
        this.freqDataArray = null;

        // Lip-sync smoothing state
        this.lipSyncState = {
          rms: 0,
          high: 0,
          low: 0,
          smoothRms: 0,
          smoothHigh: 0,
          smoothLow: 0,
          lastMouthState: 'closed',
          stateTimer: 0
        };

        // Calibration from Python tool
        this.calibration = null;

        // Frame tracking
        this.mouthTrack = new MouthTrack();
        this.videoFPS = 30;
        this.usePerFrameTracking = false;

        // Paths
        this.basePath = path.join(__dirname, '../../assets/pngtuber');
      }

      async init() {
        console.log('PNGTuber Engine initializing...');

        // Check for mouthless video first (generated by Python tool)
        const mouthlessPath = path.join(this.basePath, 'video_mouthless.mp4');
        const videoPath = path.join(this.basePath, 'video.mp4');

        let selectedVideoPath;
        if (fs.existsSync(mouthlessPath)) {
          selectedVideoPath = mouthlessPath;
          console.log('Using mouthless video (generated by Python tool)');
        } else if (fs.existsSync(videoPath)) {
          selectedVideoPath = videoPath;
          console.log('Using original video');
        } else {
          this.showPlaceholder('Falta video.mp4 en assets/pngtuber/');
          return false;
        }

        // Load video
        this.video.src = 'file://' + selectedVideoPath.replace(/\\/g, '/');
        await this.video.play().catch(e => console.log('Video autoplay blocked:', e));

        // Get video metadata
        await new Promise(resolve => {
          if (this.video.readyState >= 1) resolve();
          else this.video.addEventListener('loadedmetadata', resolve, { once: true });
        });

        this.videoFPS = 30; // Default FPS, can be overridden by tracking data
        const videoWidth = this.video.videoWidth;
        const videoHeight = this.video.videoHeight;
        console.log(`Video dimensions: ${videoWidth}x${videoHeight}`);

        // Load mouth sprites
        await this.loadMouthSprites();

        // Setup canvas
        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());

        // Load per-frame tracking data (NPZ from MotionPNGTuber or JSON)
        await this.loadTrackingData(videoWidth, videoHeight);

        // Start render loop
        this.render();

        console.log('PNGTuber Engine ready!');
        return true;
      }

      async loadTrackingData(videoWidth, videoHeight) {
        // Priority order for tracking data:
        // 1. mouth_track.json (MotionPNGTuber JSON format - includes calibration)
        // 2. mouth_track_calibrated.npz (calibrated NPZ)
        // 3. mouth_track.npz (raw NPZ)
        // 4. tracking.json (legacy format)

        const mouthTrackJsonPath = path.join(this.basePath, 'mouth_track.json');
        const npzCalibratedPath = path.join(this.basePath, 'mouth_track_calibrated.npz');
        const npzPath = path.join(this.basePath, 'mouth_track.npz');
        const trackingJsonPath = path.join(this.basePath, 'tracking.json');

        // Try mouth_track.json first (MotionPNGTuber format with embedded calibration)
        if (fs.existsSync(mouthTrackJsonPath)) {
          console.log('Loading mouth_track.json (MotionPNGTuber format)...');
          this.usePerFrameTracking = this.mouthTrack.loadFromJSON(mouthTrackJsonPath, videoWidth, videoHeight);

          if (this.usePerFrameTracking && this.mouthTrack.calibration) {
            this.calibration = this.mouthTrack.calibration;
          }
        }

        // Try NPZ formats if JSON didn't work
        if (!this.usePerFrameTracking) {
          if (fs.existsSync(npzCalibratedPath)) {
            console.log('Loading calibrated NPZ tracking data...');
            this.usePerFrameTracking = this.mouthTrack.loadFromNPZ(npzCalibratedPath, videoWidth, videoHeight);
          } else if (fs.existsSync(npzPath)) {
            console.log('Loading NPZ tracking data...');
            this.usePerFrameTracking = this.mouthTrack.loadFromNPZ(npzPath, videoWidth, videoHeight);
          }
        }

        // Fallback to tracking.json
        if (!this.usePerFrameTracking && fs.existsSync(trackingJsonPath)) {
          console.log('Loading tracking.json...');
          this.usePerFrameTracking = this.mouthTrack.loadFromJSON(trackingJsonPath, videoWidth, videoHeight);

          if (!this.usePerFrameTracking && this.mouthTrack.staticPosition) {
            this.mouthPosition = { ...this.mouthTrack.staticPosition };
            this.mouthScale = this.mouthTrack.staticScale;
            console.log('Using static position from tracking.json');
          }
        }

        if (this.usePerFrameTracking) {
          console.log(`Per-frame tracking enabled: ${this.mouthTrack.totalFrames} frames`);
          this.videoFPS = this.mouthTrack.fps;

          if (this.mouthTrack.refSpriteSize) {
            console.log('Reference sprite size:', this.mouthTrack.refSpriteSize);
          }
        } else {
          console.log('Using static mouth position (no per-frame tracking)');
        }
      }

      /**
       * Get current video frame index
       */
      getCurrentFrameIndex() {
        if (!this.video || this.video.paused) return 0;

        const currentTime = this.video.currentTime;
        const frameIndex = Math.floor(currentTime * this.videoFPS);

        return frameIndex;
      }

      async loadMouthSprites() {
        const mouthTypes = ['closed', 'half', 'open', 'e', 'u'];
        const mouthsPath = path.join(this.basePath, 'mouths');

        for (const type of mouthTypes) {
          const spritePath = path.join(mouthsPath, `${type}.png`);
          if (fs.existsSync(spritePath)) {
            const img = new Image();
            img.src = 'file://' + spritePath.replace(/\\/g, '/');
            await new Promise(resolve => img.onload = resolve);
            this.mouthSprites[type] = img;
            console.log(`Loaded mouth sprite: ${type}`);
          }
        }

        // If no sprites found, create simple colored circles as fallback
        if (Object.keys(this.mouthSprites).length === 0) {
          console.log('No mouth sprites found, using fallback');
          this.createFallbackSprites();
        }
      }

      createFallbackSprites() {
        const sizes = {
          closed: 5,
          half: 10,
          open: 20,
          e: 15,
          u: 12
        };

        for (const [type, size] of Object.entries(sizes)) {
          const canvas = document.createElement('canvas');
          canvas.width = 50;
          canvas.height = 50;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath();
          ctx.ellipse(25, 25, 20, size, 0, 0, Math.PI * 2);
          ctx.fill();

          const img = new Image();
          img.src = canvas.toDataURL();
          this.mouthSprites[type] = img;
        }
      }

      resizeCanvas() {
        this.canvas.width = this.canvas.offsetWidth;
        this.canvas.height = this.canvas.offsetHeight;
      }

      connectAudio(audioElement) {
        if (!this.audioContext) {
          this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        // Create audio source from element
        const source = this.audioContext.createMediaElementSource(audioElement);

        // Create analyser with larger FFT for better frequency resolution
        this.analyser = this.audioContext.createAnalyser();
        this.analyser.fftSize = 512;
        this.analyser.smoothingTimeConstant = 0.5; // Less smoothing for more responsive lip-sync

        // Connect: source -> analyser -> destination
        source.connect(this.analyser);
        this.analyser.connect(this.audioContext.destination);

        // Create data arrays for both time domain (RMS) and frequency analysis
        this.timeDataArray = new Float32Array(this.analyser.fftSize);
        this.freqDataArray = new Uint8Array(this.analyser.frequencyBinCount);

        // Lip-sync state for smooth transitions
        this.lipSyncState = {
          rms: 0,
          high: 0,
          low: 0,
          smoothRms: 0,
          smoothHigh: 0,
          smoothLow: 0,
          lastMouthState: 'closed',
          stateTimer: 0
        };

        this.isAnalyzing = true;
        console.log('Audio connected for lip-sync (MotionPNGTuber compatible)');
      }

      /**
       * Process audio data like MotionPNGTuber format
       * Can also receive external data: { rms, high, low }
       */
      processAudioData(externalData = null) {
        if (externalData) {
          // External data input (MotionPNGTuber compatible API)
          this.lipSyncState.rms = externalData.rms || 0;
          this.lipSyncState.high = externalData.high || 0;
          this.lipSyncState.low = externalData.low || 0;
          return;
        }

        if (!this.analyser) return;

        // Get time domain data for accurate RMS calculation
        this.analyser.getFloatTimeDomainData(this.timeDataArray);

        // Calculate RMS from time domain data (proper volume measurement)
        let sumSquares = 0;
        for (let i = 0; i < this.timeDataArray.length; i++) {
          sumSquares += this.timeDataArray[i] * this.timeDataArray[i];
        }
        const rms = Math.sqrt(sumSquares / this.timeDataArray.length);

        // Get frequency data for high/low analysis
        this.analyser.getByteFrequencyData(this.freqDataArray);

        // Divide frequency spectrum into low and high bands
        // Low: 0-500Hz (roughly bins 0-23 at 44.1kHz with 512 FFT)
        // High: 500Hz+ (bins 24+)
        const binCount = this.freqDataArray.length;
        const lowBinEnd = Math.floor(binCount * 0.18); // ~500Hz
        const highBinStart = Math.floor(binCount * 0.18);

        let lowSum = 0, highSum = 0;
        let lowCount = 0, highCount = 0;

        for (let i = 0; i < lowBinEnd; i++) {
          lowSum += this.freqDataArray[i];
          lowCount++;
        }
        for (let i = highBinStart; i < binCount; i++) {
          highSum += this.freqDataArray[i];
          highCount++;
        }

        // Normalize to 0.0-1.0 range
        const low = lowCount > 0 ? (lowSum / lowCount) / 255 : 0;
        const high = highCount > 0 ? (highSum / highCount) / 255 : 0;

        // Store raw values
        this.lipSyncState.rms = Math.min(1, rms * 3); // Scale up RMS for sensitivity
        this.lipSyncState.high = high;
        this.lipSyncState.low = low;

        // Apply smoothing for natural transitions
        const smoothFactor = 0.3; // Lower = smoother
        this.lipSyncState.smoothRms = this.lipSyncState.smoothRms * (1 - smoothFactor) + this.lipSyncState.rms * smoothFactor;
        this.lipSyncState.smoothHigh = this.lipSyncState.smoothHigh * (1 - smoothFactor) + this.lipSyncState.high * smoothFactor;
        this.lipSyncState.smoothLow = this.lipSyncState.smoothLow * (1 - smoothFactor) + this.lipSyncState.low * smoothFactor;
      }

      analyzeMouth() {
        if (!this.isAnalyzing || !this.analyser) {
          return 'closed';
        }

        // Process audio to update lip-sync state
        this.processAudioData();

        const { smoothRms, smoothHigh, smoothLow } = this.lipSyncState;

        // Update debug info
        this.updateDebug(`RMS: ${smoothRms.toFixed(3)} | H: ${smoothHigh.toFixed(3)} | L: ${smoothLow.toFixed(3)}`);

        // Determine mouth state based on audio analysis (MotionPNGTuber style)
        // Thresholds calibrated for normalized 0.0-1.0 values
        const volumeThreshold = 0.02;  // Minimum volume to open mouth
        const halfThreshold = 0.08;    // Volume for half-open
        const openThreshold = 0.15;    // Volume for fully open

        let newState;

        if (smoothRms < volumeThreshold) {
          newState = 'closed';
        } else if (smoothRms < halfThreshold) {
          newState = 'half';
        } else {
          // Use frequency analysis for vowel shapes when volume is high enough
          const freqRatio = smoothLow / (smoothHigh + 0.001);

          if (freqRatio > 1.5 && smoothLow > 0.1) {
            newState = 'u'; // Low frequencies dominant = 'u' shape
          } else if (freqRatio < 0.7 && smoothHigh > 0.1) {
            newState = 'e'; // High frequencies dominant = 'e' shape
          } else if (smoothRms > openThreshold) {
            newState = 'open';
          } else {
            newState = 'half';
          }
        }

        // State transition smoothing - prevent rapid flickering
        if (newState !== this.lipSyncState.lastMouthState) {
          this.lipSyncState.stateTimer++;
          // Require state to be stable for 2 frames before changing
          if (this.lipSyncState.stateTimer >= 2) {
            this.lipSyncState.lastMouthState = newState;
            this.lipSyncState.stateTimer = 0;
          }
        } else {
          this.lipSyncState.stateTimer = 0;
        }

        return this.lipSyncState.lastMouthState;
      }

      render() {
        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Analyze audio and get mouth state
        const mouthState = this.analyzeMouth();

        // Get current mouth position (per-frame or static)
        let mouthX, mouthY, mouthWidth, mouthRotation;

        if (this.usePerFrameTracking) {
          // Get frame-synchronized position
          const frameIndex = this.getCurrentFrameIndex();
          const quad = this.mouthTrack.getQuad(frameIndex);

          if (quad) {
            // Calculate position from quad
            const pos = this.mouthTrack.getPositionFromQuad(quad, this.video.videoWidth, this.video.videoHeight);

            // Convert to canvas coordinates (accounting for object-fit: contain)
            const videoAspect = this.video.videoWidth / this.video.videoHeight;
            const canvasAspect = this.canvas.width / this.canvas.height;

            let videoDisplayWidth, videoDisplayHeight, offsetX, offsetY;

            if (videoAspect > canvasAspect) {
              // Video is wider - letterbox top/bottom
              videoDisplayWidth = this.canvas.width;
              videoDisplayHeight = this.canvas.width / videoAspect;
              offsetX = 0;
              offsetY = (this.canvas.height - videoDisplayHeight) / 2;
            } else {
              // Video is taller - letterbox left/right
              videoDisplayHeight = this.canvas.height;
              videoDisplayWidth = this.canvas.height * videoAspect;
              offsetX = (this.canvas.width - videoDisplayWidth) / 2;
              offsetY = 0;
            }

            mouthX = offsetX + pos.x * videoDisplayWidth;
            mouthY = offsetY + pos.y * videoDisplayHeight;
            mouthWidth = pos.scale * videoDisplayWidth;
            mouthRotation = pos.rotation;

            // Update debug info with frame tracking
            if (this.debugInfo.classList.contains('visible')) {
              this.updateDebug(`Frame: ${frameIndex} | Pos: (${pos.x.toFixed(2)}, ${pos.y.toFixed(2)})`);
            }
          } else {
            // Fallback to static position
            mouthX = this.canvas.width * this.mouthPosition.x;
            mouthY = this.canvas.height * this.mouthPosition.y;
            mouthWidth = this.canvas.width * this.mouthScale;
            mouthRotation = 0;
          }
        } else {
          // Use static position
          mouthX = this.canvas.width * this.mouthPosition.x;
          mouthY = this.canvas.height * this.mouthPosition.y;
          mouthWidth = this.canvas.width * this.mouthScale;
          mouthRotation = 0;
        }

        // Draw mouth sprite if available
        const sprite = this.mouthSprites[mouthState];
        if (sprite) {
          const mouthHeight = mouthWidth * (sprite.height / sprite.width);

          // Save context for rotation
          this.ctx.save();

          // Apply rotation around mouth center
          if (mouthRotation !== 0) {
            this.ctx.translate(mouthX, mouthY);
            this.ctx.rotate(mouthRotation);
            this.ctx.translate(-mouthX, -mouthY);
          }

          this.ctx.drawImage(
            sprite,
            mouthX - mouthWidth / 2,
            mouthY - mouthHeight / 2,
            mouthWidth,
            mouthHeight
          );

          // Restore context
          this.ctx.restore();
        }

        this.currentMouth = mouthState;

        // Continue render loop
        requestAnimationFrame(() => this.render());
      }

      updateDebug(text) {
        if (this.debugInfo) {
          this.debugInfo.textContent = text;
        }
      }

      showPlaceholder(message) {
        const container = document.getElementById('pngtuber-container');
        container.innerHTML = `
          <div style="color:#fff; background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px; font-family:Arial; font-size:12px; border-radius:8px; text-align:center;
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80%;">
            <strong>PNGTuber Mode</strong><br><br>
            ${message}<br><br>
            <small>Coloca los archivos en:<br>assets/pngtuber/</small>
          </div>
        `;
      }

      // Set mouth position (can be loaded from tracking.json)
      setMouthPosition(x, y, scale) {
        this.mouthPosition = { x, y };
        if (scale) this.mouthScale = scale;
      }

      stopAnalysis() {
        this.isAnalyzing = false;
        // Reset to closed mouth when audio stops
        this.lipSyncState.lastMouthState = 'closed';
        this.lipSyncState.smoothRms = 0;
        this.lipSyncState.smoothHigh = 0;
        this.lipSyncState.smoothLow = 0;
      }

      startAnalysis() {
        this.isAnalyzing = true;
        // Reset smoothing state for fresh start
        this.lipSyncState.smoothRms = 0;
        this.lipSyncState.smoothHigh = 0;
        this.lipSyncState.smoothLow = 0;
        this.lipSyncState.stateTimer = 0;
      }
    }

    const WEBHOOK_URL = 'https://n8n.srv775163.hstgr.cloud/webhook/desktop-avatar';

    let isProcessing = false;
    let pngtuber = null;

    // Voice recording state
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const chatBox = document.getElementById('chat-box');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatVoice = document.getElementById('chat-voice');
    const ttsAudio = document.getElementById('tts-audio');

    function initChat() {
      // Auto-open chat on initialization
      chatBox.classList.add('visible');
      chatInput.focus();

      chatSend.addEventListener('click', sendMessage);
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Voice recording button
      chatVoice.addEventListener('click', toggleVoiceRecording);

      // Audio events for lip-sync
      ttsAudio.addEventListener('play', () => {
        console.log('Audio playing - start lip-sync');
        if (pngtuber && !pngtuber.analyser) {
          pngtuber.connectAudio(ttsAudio);
        }
        pngtuber?.startAnalysis();
      });

      ttsAudio.addEventListener('ended', () => {
        console.log('Audio ended - stop lip-sync');
        pngtuber?.stopAnalysis();
      });

      ttsAudio.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        addMessage('Error reproduciendo audio', 'system');
      });

      console.log('Chat initialized');
    }

    async function toggleVoiceRecording() {
      if (isProcessing) return;

      if (isRecording) {
        // Stop recording
        stopVoiceRecording();
      } else {
        // Start recording
        await startVoiceRecording();
      }
    }

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'audio/webm;codecs=opus'
        });

        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          // Stop all tracks to release microphone
          stream.getTracks().forEach(track => track.stop());

          // Create audio blob and send to webhook
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await sendVoiceMessage(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        chatVoice.classList.add('recording');
        chatVoice.title = 'Detener grabación';
        chatInput.placeholder = 'Grabando...';
        chatInput.disabled = true;
        chatSend.disabled = true;

        console.log('Voice recording started');
      } catch (error) {
        console.error('Error accessing microphone:', error);
        addMessage('Error: No se pudo acceder al micrófono', 'system');
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        isRecording = false;
        chatVoice.classList.remove('recording');
        chatVoice.title = 'Mensaje de voz';
        chatInput.placeholder = 'Escribe un mensaje...';
        chatInput.disabled = false;

        console.log('Voice recording stopped');
      }
    }

    async function sendVoiceMessage(audioBlob) {
      addMessage('[Mensaje de voz]', 'user');

      isProcessing = true;
      chatSend.disabled = true;
      chatVoice.disabled = true;
      showLoading();

      try {
        // Create FormData to send audio file
        const formData = new FormData();
        formData.append('audio', audioBlob, 'voice_message.webm');

        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const responseBlob = await response.blob();
        console.log('Received audio response:', responseBlob.type, responseBlob.size, 'bytes');

        const audioUrl = URL.createObjectURL(responseBlob);
        ttsAudio.src = audioUrl;
        await ttsAudio.play();

      } catch (error) {
        console.error('Voice message error:', error);
        addMessage(`Error: ${error.message}`, 'system');
      } finally {
        hideLoading();
        isProcessing = false;
        chatSend.disabled = false;
        chatVoice.disabled = false;
      }
    }

    function addMessage(text, type = 'user') {
      const msg = document.createElement('div');
      msg.className = `chat-message ${type}`;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Auto fade-out after 15 seconds
      setTimeout(() => {
        msg.classList.add('fading');
        // Remove from DOM after fade animation completes
        setTimeout(() => {
          if (msg.parentNode) {
            msg.parentNode.removeChild(msg);
          }
        }, 1500); // Wait for fade + collapse animation
      }, 15000); // 15 seconds before starting fade
    }

    function showLoading() {
      const loading = document.createElement('div');
      loading.className = 'chat-loading';
      loading.id = 'chat-loading';
      loading.innerHTML = '<span></span><span></span><span></span>';
      chatMessages.appendChild(loading);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideLoading() {
      const loading = document.getElementById('chat-loading');
      if (loading) loading.remove();
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isProcessing) return;

      addMessage(text, 'user');
      chatInput.value = '';

      isProcessing = true;
      chatSend.disabled = true;
      showLoading();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const audioBlob = await response.blob();
        console.log('Received audio:', audioBlob.type, audioBlob.size, 'bytes');

        const audioUrl = URL.createObjectURL(audioBlob);
        ttsAudio.src = audioUrl;
        await ttsAudio.play();

      } catch (error) {
        console.error('Chat error:', error);
        addMessage(`Error: ${error.message}`, 'system');
      } finally {
        hideLoading();
        isProcessing = false;
        chatSend.disabled = false;
      }
    }

    // ============================================
    // DRAG CONTROLS
    // ============================================

    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    function setupDragControls() {
      const container = document.getElementById('pngtuber-container');

      container.onmousedown = async (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        const pos = await ipcRenderer.invoke('get-avatar-position');
        dragOffset.x = e.screenX - pos.x;
        dragOffset.y = e.screenY - pos.y;
      };

      document.onmousemove = async (e) => {
        if (!isDragging) return;
        await ipcRenderer.invoke('set-avatar-position', {
          x: e.screenX - dragOffset.x,
          y: e.screenY - dragOffset.y
        });
      };

      document.onmouseup = () => isDragging = false;
    }

    // ============================================
    // SETTINGS MENU MODULE
    // ============================================

    const settingsBtn = document.getElementById('settings-btn');
    const settingsMenu = document.getElementById('settings-menu');
    const menuGestor = document.getElementById('menu-gestor');
    const menuExtractor = document.getElementById('menu-extractor');
    const menuCalibrarPy = document.getElementById('menu-calibrar-py');
    const menuDebug = document.getElementById('menu-debug');

    let isMenuOpen = false;

    function initSettingsMenu() {
      // Toggle menu on gear button click
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSettingsMenu();
      });

      // Close menu when clicking outside
      document.addEventListener('click', (e) => {
        if (isMenuOpen && !settingsMenu.contains(e.target) && e.target !== settingsBtn) {
          closeSettingsMenu();
        }
      });

      // Menu item handlers
      menuGestor.addEventListener('click', () => {
        closeSettingsMenu();
        launchPythonTool('gestor_pngtuber_gui.py');
      });

      menuExtractor.addEventListener('click', () => {
        closeSettingsMenu();
        launchPythonTool('extractor_bocas_gui.py');
      });

      menuCalibrarPy.addEventListener('click', () => {
        closeSettingsMenu();
        launchPythonTool('calibrar_boca.py');
      });

      menuDebug.addEventListener('click', () => {
        closeSettingsMenu();
        toggleDebugInfo();
      });
    }

    function toggleSettingsMenu() {
      isMenuOpen = !isMenuOpen;
      settingsMenu.classList.toggle('visible', isMenuOpen);
    }

    function closeSettingsMenu() {
      isMenuOpen = false;
      settingsMenu.classList.remove('visible');
    }

    function launchPythonTool(scriptName) {
      const toolsPath = path.join(__dirname, '../../tools');
      const scriptPath = path.join(toolsPath, scriptName);

      if (!fs.existsSync(scriptPath)) {
        showToolFeedback(`Error: No se encontró ${scriptName}`);
        console.error(`Script not found: ${scriptPath}`);
        return;
      }

      showToolFeedback(`Iniciando ${scriptName}...`);

      // Try to find Python executable
      const pythonCommands = ['python', 'python3', 'py'];
      let pythonProcess = null;

      for (const cmd of pythonCommands) {
        try {
          pythonProcess = spawn(cmd, [scriptPath], {
            cwd: toolsPath,
            detached: true,
            stdio: 'ignore'
          });

          pythonProcess.unref();
          console.log(`Launched ${scriptName} with ${cmd}`);
          break;
        } catch (e) {
          console.log(`Failed to launch with ${cmd}:`, e.message);
        }
      }

      if (!pythonProcess) {
        showToolFeedback('Error: Python no encontrado. Instala Python 3.');
      }
    }

    function toggleDebugInfo() {
      const debugInfo = document.getElementById('debug-info');
      debugInfo.classList.toggle('visible');
      showToolFeedback(debugInfo.classList.contains('visible') ? 'Debug activado' : 'Debug desactivado');
    }

    function showToolFeedback(message) {
      const feedback = document.createElement('div');
      feedback.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.85);
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        z-index: 2000;
        animation: feedbackFade 2.5s ease;
        border-left: 3px solid #667eea;
      `;
      feedback.textContent = message;
      document.body.appendChild(feedback);

      setTimeout(() => feedback.remove(), 2500);
    }

    // Add animation keyframes for feedback
    const feedbackStyle = document.createElement('style');
    feedbackStyle.textContent = `
      @keyframes feedbackFade {
        0% { opacity: 0; transform: translateX(20px); }
        15% { opacity: 1; transform: translateX(0); }
        85% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(20px); }
      }
    `;
    document.head.appendChild(feedbackStyle);

    // ============================================
    // INITIALIZE
    // ============================================

    async function init() {
      console.log('=== Desktop Avatar (PNGTuber Mode) ===');

      // Initialize PNGTuber engine
      pngtuber = new PNGTuberEngine();
      await pngtuber.init();

      // Load tracking data if available
      const trackingPath = path.join(__dirname, '../../assets/pngtuber/tracking.json');
      if (fs.existsSync(trackingPath)) {
        try {
          const tracking = JSON.parse(fs.readFileSync(trackingPath, 'utf8'));
          if (tracking.mouth) {
            pngtuber.setMouthPosition(
              tracking.mouth.x,
              tracking.mouth.y,
              tracking.mouth.scale
            );
          }
          console.log('Loaded tracking data');
        } catch (e) {
          console.log('No tracking data loaded');
        }
      }

      // Initialize chat, drag, and settings menu
      initChat();
      setupDragControls();
      initSettingsMenu();

      console.log('PNGTuber Avatar ready!');
    }

    // Start
    init();
  </script>
</body>
</html>
