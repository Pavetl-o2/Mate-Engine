<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Avatar</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Preparar rutas para import map
    const basePath = 'file:///' + __dirname.replace(/\\/g, '/');
    const nodeModules = basePath + '/../../node_modules';

    // Crear import map dinámicamente
    const importMap = {
      imports: {
        "three": nodeModules + "/three/build/three.module.js",
        "three/": nodeModules + "/three/"
      }
    };

    const script = document.createElement('script');
    script.type = 'importmap';
    script.textContent = JSON.stringify(importMap);
    document.head.appendChild(script);
  </script>
</head>
<body>
  <div id="avatar-container">
    <canvas id="avatar-canvas"></canvas>
  </div>

  <!-- Chat Toggle Button -->
  <button id="chat-toggle" title="Chat">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
  </button>

  <!-- Chat Box -->
  <div id="chat-container">
    <div id="chat-box">
      <div id="chat-messages"></div>
      <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Type here..." autocomplete="off">
        <button id="chat-send">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Audio element for TTS playback -->
  <audio id="tts-audio" style="display:none;"></audio>

  <script>
    // Guardar referencias de Node.js antes de cargar módulos ES
    window.nodeRequire = require;
    window.nodeFs = require('fs');
    window.nodePath = require('path');
    window.nodeIpc = require('electron').ipcRenderer;
    window.appDirname = __dirname;
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    // Variables globales
    let scene, camera, renderer, model, mixer, clock;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    // Acceso a Node.js
    const fs = window.nodeFs;
    const path = window.nodePath;
    const ipcRenderer = window.nodeIpc;
    const __dirname = window.appDirname;

    console.log('=== Desktop Avatar ===');
    console.log('Three.js version:', THREE.REVISION);

    // Ruta al modelo
    const modelPath = path.join(__dirname, '../../assets/models/avatar.glb');
    console.log('Modelo:', modelPath);

    // Verificar archivo
    if (!fs.existsSync(modelPath)) {
      showError('No se encontró: avatar.glb');
    } else {
      console.log('Archivo encontrado!');
      init();
    }

    async function init() {
      setupScene();
      setupLights();
      setupControls();
      await loadGLB(modelPath);
      animate();
    }

    function setupScene() {
      const canvas = document.getElementById('avatar-canvas');

      scene = new THREE.Scene();

      const aspect = canvas.clientWidth / canvas.clientHeight;
      camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 100);  // FOV más amplio
      camera.position.set(0, 1, 3);
      camera.lookAt(0, 0.8, 0);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      clock = new THREE.Clock();
      console.log('Escena lista');
    }

    function setupLights() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));

      const front = new THREE.DirectionalLight(0xffffff, 1);
      front.position.set(0, 2, 3);
      scene.add(front);

      const fill = new THREE.DirectionalLight(0xffffff, 0.5);
      fill.position.set(-2, 1, 0);
      scene.add(fill);

      const back = new THREE.DirectionalLight(0xffffff, 0.3);
      back.position.set(0, 1, -2);
      scene.add(back);

      console.log('Luces listas');
    }

    async function loadGLB(filePath) {
      console.log('Cargando GLB...');

      // Leer archivo
      const buffer = fs.readFileSync(filePath);
      const arrayBuffer = buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);

      const loader = new GLTFLoader();

      return new Promise((resolve, reject) => {
        loader.parse(
          arrayBuffer,
          '',
          (gltf) => {
            console.log('GLB parseado:', gltf);

            model = gltf.scene;
            scene.add(model);
            fitModel(model);

            if (gltf.animations.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              // Setup animation mapping
              setupAnimations(gltf);
              // Play idle by default
              playAnimation('idle');
            }

            console.log('¡Modelo cargado!');
            resolve(gltf);
          },
          (error) => {
            console.error('Error:', error);
            showError('Error cargando modelo');
            reject(error);
          }
        );
      });
    }

    function fitModel(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      console.log('Tamaño original:', size);

      // Escala original
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.6 / maxDim;
      obj.scale.setScalar(scale);

      // Recalcular bounds
      box.setFromObject(obj);
      box.getCenter(center);

      // Centrar horizontalmente, poner en el suelo
      obj.position.x = -center.x;
      obj.position.y = -box.min.y;
      obj.position.z = -center.z;

      // Cámara posicionada para ver modelo completo en ventana pequeña
      const h = size.y * scale;
      camera.position.set(0, h * 1.0, 2.5);
      camera.lookAt(0, h * 0.8, 0);

      console.log('Escala:', scale);
    }

    function setupControls() {
      const container = document.getElementById('avatar-container');

      container.onmousedown = async (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        const pos = await ipcRenderer.invoke('get-avatar-position');
        dragOffset.x = e.screenX - pos.x;
        dragOffset.y = e.screenY - pos.y;
      };

      document.onmousemove = async (e) => {
        if (!isDragging) return;
        await ipcRenderer.invoke('set-avatar-position', {
          x: e.screenX - dragOffset.x,
          y: e.screenY - dragOffset.y
        });
      };

      document.onmouseup = () => isDragging = false;
    }

    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(clock.getDelta());
      renderer.render(scene, camera);
    }

    function showError(msg) {
      document.getElementById('avatar-container').innerHTML = `
        <div style="color:#fff; background:linear-gradient(135deg,#c0392b,#e74c3c);
          padding:15px; font-family:Arial; font-size:12px; border-radius:8px; text-align:center;">
          <strong>Error</strong><br><br>${msg}
        </div>
      `;
    }

    // ============================================
    // CHAT MODULE
    // ============================================

    // Configuration - CHANGE THIS TO YOUR WEBHOOK URL
    const WEBHOOK_URL = 'https://n8n.srv775163.hstgr.cloud/webhook/desktop-avatar';

    // Store animations for different states
    let animations = {};
    let currentAnimation = null;

    // Chat state
    let isChatOpen = false;
    let isProcessing = false;

    // DOM Elements
    const chatToggle = document.getElementById('chat-toggle');
    const chatBox = document.getElementById('chat-box');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const ttsAudio = document.getElementById('tts-audio');

    // Initialize chat
    function initChat() {
      chatToggle.addEventListener('click', toggleChat);
      chatSend.addEventListener('click', sendMessage);
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Audio events
      ttsAudio.addEventListener('play', () => {
        console.log('Audio playing - trigger speaking animation');
        playAnimation('speaking');
      });

      ttsAudio.addEventListener('ended', () => {
        console.log('Audio ended - return to idle');
        playAnimation('idle');
      });

      ttsAudio.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        addMessage('Error reproduciendo audio', 'system');
      });

      console.log('Chat initialized');
    }

    function toggleChat() {
      isChatOpen = !isChatOpen;
      chatBox.classList.toggle('visible', isChatOpen);
      if (isChatOpen) {
        chatInput.focus();
      }
    }

    function addMessage(text, type = 'user') {
      const msg = document.createElement('div');
      msg.className = `chat-message ${type}`;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Auto fade-out after 15 seconds
      setTimeout(() => {
        msg.classList.add('fading');
        // Remove from DOM after fade animation completes
        setTimeout(() => {
          if (msg.parentNode) {
            msg.parentNode.removeChild(msg);
          }
        }, 1500); // Wait for fade + collapse animation
      }, 15000); // 15 seconds before starting fade
    }

    function showLoading() {
      const loading = document.createElement('div');
      loading.className = 'chat-loading';
      loading.id = 'chat-loading';
      loading.innerHTML = '<span></span><span></span><span></span>';
      chatMessages.appendChild(loading);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideLoading() {
      const loading = document.getElementById('chat-loading');
      if (loading) loading.remove();
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isProcessing) return;

      // Add user message
      addMessage(text, 'user');
      chatInput.value = '';

      // Set processing state
      isProcessing = true;
      chatSend.disabled = true;
      showLoading();

      // Trigger thinking animation
      playAnimation('thinking');

      try {
        // Send to webhook
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ text: text })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        // Get audio response
        const audioBlob = await response.blob();
        console.log('Received audio:', audioBlob.type, audioBlob.size, 'bytes');

        // Play audio
        const audioUrl = URL.createObjectURL(audioBlob);
        ttsAudio.src = audioUrl;
        await ttsAudio.play();

        // Note: We don't add assistant text message since response is audio
        // If you want text too, your webhook should return JSON with both

      } catch (error) {
        console.error('Chat error:', error);
        addMessage(`Error: ${error.message}`, 'system');
        playAnimation('idle');
      } finally {
        hideLoading();
        isProcessing = false;
        chatSend.disabled = false;
      }
    }

    // Animation management
    function setupAnimations(gltf) {
      if (!gltf.animations || gltf.animations.length === 0) return;

      console.log('Available animations:');
      gltf.animations.forEach((clip, i) => {
        console.log(`  ${i}: ${clip.name}`);
        // Map animation names (adjust based on your GLB)
        const nameLower = clip.name.toLowerCase();
        if (nameLower.includes('idle') && !nameLower.includes('long')) {
          animations.idle = clip;
        } else if (nameLower.includes('long') || nameLower.includes('longidle')) {
          animations.longIdle = clip;
        } else if (nameLower.includes('think')) {
          animations.thinking = clip;
        } else if (nameLower.includes('speak') || nameLower.includes('talk')) {
          animations.speaking = clip;
        }
      });

      // Default to first animation if no idle found
      if (!animations.idle && gltf.animations.length > 0) {
        animations.idle = gltf.animations[0];
      }

      console.log('Mapped animations:', Object.keys(animations));
    }

    function playAnimation(name) {
      if (!mixer || !animations[name]) {
        console.log(`Animation '${name}' not available`);
        return;
      }

      if (currentAnimation === name) return;

      console.log(`Playing animation: ${name}`);

      // Fade out current, fade in new
      const clip = animations[name];
      const action = mixer.clipAction(clip);

      mixer.stopAllAction();
      action.reset();
      action.fadeIn(0.3);
      action.play();

      currentAnimation = name;
    }

    // Initialize chat when DOM is ready
    initChat();
  </script>
</body>
</html>
